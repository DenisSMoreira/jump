<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101522">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="description" content="Skybound, uma ascensão vertical original com desafios, coleções e duelos 1x1.">
  <title>SKYBOUND // Ascensão</title>
  <style>
    :root{--ink:#101522;--panel:rgba(24,33,50,.94);--panel2:#202c42;--line:rgba(227,238,255,.14);--paper:#f1f5ff;--muted:#9daac2;--mint:#91f2bd;--coral:#ff846d;--sun:#ffd166;--blue:#76b9ff;--radius:18px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink)}body{color:var(--paper);font:500 15px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}.app{width:min(100%,540px);min-height:100svh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(80% 40% at 100% 0%,rgba(118,185,255,.17),transparent 70%),radial-gradient(70% 35% at 0% 100%,rgba(145,242,189,.08),transparent 70%),var(--ink)}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--safe-top)) 20px 12px}.brand{letter-spacing:.22em;font-weight:900;font-size:16px}.brand span{color:var(--mint)}.wallet{display:flex;gap:8px;align-items:center}.wallet-chip{display:inline-flex;gap:5px;align-items:center;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);font-size:12px}.wallet-chip b{color:var(--sun)}.wallet-chip.premium b{color:var(--mint)}#screen{min-height:calc(100svh - 70px);padding:0 18px calc(88px + var(--safe-bottom))}.eyebrow{color:var(--mint);letter-spacing:.18em;text-transform:uppercase;font-size:11px;font-weight:800}h1,h2,h3,p{margin:0}h1{margin-top:18px;font-size:clamp(31px,9vw,52px);line-height:.95;letter-spacing:-.055em;max-width:410px}h1 em{color:var(--coral);font-style:normal}h2{font-size:25px;letter-spacing:-.03em}h3{font-size:16px}.lede{color:var(--muted);margin-top:12px;max-width:390px}.hero{position:relative;padding:8px 4px 22px}.hero:after{content:"";position:absolute;width:170px;height:170px;right:0;top:24px;border-radius:50%;background:conic-gradient(from 190deg,var(--coral),var(--sun),var(--mint),var(--coral));opacity:.16;filter:blur(2px)}.hero>*{position:relative;z-index:1}.grid{display:grid;gap:11px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:linear-gradient(145deg,rgba(35,48,72,.95),rgba(21,30,47,.95));border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:0 18px 44px rgba(0,0,0,.18)}.card.interactive{min-height:124px;position:relative;overflow:hidden;text-align:left;transition:transform .16s ease,border-color .16s ease}.card.interactive:active{transform:scale(.985);border-color:var(--mint)}.card.interactive:after{content:attr(data-mark);position:absolute;right:12px;bottom:0;color:rgba(255,255,255,.08);font-size:56px;font-weight:900;line-height:1}.card.interactive p{color:var(--muted);font-size:12px;margin-top:8px;max-width:190px}.card .arrow{position:absolute;right:14px;top:14px;color:var(--mint);font-size:20px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 2px 10px}.section-head small{color:var(--muted)}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 17px;border-radius:13px;background:var(--mint);color:#102117;font-weight:900;letter-spacing:.02em}.button.secondary{background:var(--panel2);color:var(--paper);border:1px solid var(--line)}.button.coral{background:var(--coral);color:#2b1112}.button.small{min-height:35px;padding:0 11px;font-size:12px}.button:disabled{opacity:.42;cursor:not-allowed}.wide{width:100%}.progress{height:7px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--mint),var(--blue))}.mission{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}.mission-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(145,242,189,.13);color:var(--mint);font-weight:900}.mission p{color:var(--muted);font-size:12px}.mission .value{color:var(--sun);font-size:12px;white-space:nowrap}.bottom-nav{position:fixed;z-index:10;bottom:0;left:50%;width:min(100%,540px);transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px calc(8px + var(--safe-bottom));background:rgba(16,21,34,.93);border-top:1px solid var(--line);backdrop-filter:blur(16px)}.nav-item{min-height:48px;background:transparent;color:var(--muted);font-size:11px;display:grid;gap:1px;place-items:center}.nav-item b{font-size:19px;line-height:1;color:inherit}.nav-item.active,.nav-item:active{color:var(--mint)}.screen-title{display:flex;align-items:center;gap:10px;padding-top:12px}.back{width:38px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:20px}.stage-card{min-height:148px;display:flex;flex-direction:column;justify-content:space-between;background:var(--stage,#334);border:0}.stage-card.locked{filter:saturate(.35);opacity:.65}.stage-card .stage-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.stage-card h3{margin-top:15px;font-size:21px}.stage-card p{color:rgba(255,255,255,.72);font-size:12px;margin-top:3px}.stage-card .stage-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:11px}.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:rgba(0,0,0,.13);color:var(--paper);border-radius:99px;padding:4px 8px;font-size:10px}.character{display:flex;align-items:center;gap:12px}.avatar{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:var(--avatar,var(--mint));color:#15202e;font-size:26px;font-weight:900;box-shadow:inset 0 -8px rgba(0,0,0,.12)}.character p{color:var(--muted);font-size:12px}.cosmetic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cosmetic{position:relative;min-height:126px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.cosmetic.equipped{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}.cosmetic .swatch{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:var(--swatch);color:#101522;font-size:20px;font-weight:900}.cosmetic h3{margin-top:10px;font-size:13px}.cosmetic small{color:var(--muted);font-size:10px}.lock{position:absolute;right:10px;top:10px;color:var(--sun);font-size:12px}.notice{padding:12px 13px;border-radius:13px;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.28);color:#ffe5a0;font-size:12px}.stat-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.stat-row:last-child{border-bottom:0}.stat-row span{color:var(--muted)}.stat-row b{color:var(--paper)}.toggle{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}.toggle p{color:var(--muted);font-size:12px}.switch{width:44px;height:26px;border-radius:99px;background:#35445d;padding:3px;flex:0 0 auto}.switch i{width:20px;height:20px;display:block;border-radius:50%;background:#fff;transition:transform .18s ease}.switch.on{background:var(--mint)}.switch.on i{transform:translateX(18px);background:#122319}.consent{position:fixed;z-index:30;bottom:calc(79px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 28px),500px);padding:15px;border:1px solid var(--line);border-radius:16px;background:#202b41;box-shadow:0 20px 60px rgba(0,0,0,.4)}.consent p{color:var(--muted);font-size:12px;margin:6px 0 12px}.consent-actions{display:flex;gap:8px}.consent-actions .button{flex:1}.game-shell{position:relative;margin:0 -18px;min-height:calc(100svh - 74px);display:flex;flex-direction:column}.game-hud{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:rgba(16,21,34,.84)}.game-hud .metric{display:grid;gap:0}.game-hud small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.12em}.game-hud b{color:var(--paper);font-size:17px}.game-hud .stage-name{color:var(--mint);font-size:12px;font-weight:800}.game-canvas-wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;background:#16243b;overflow:hidden}canvas{display:block;width:min(100vw,420px);height:auto;max-height:calc(100svh - 195px);aspect-ratio:9 / 16;image-rendering:auto;touch-action:none}.duel-label{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:5px 9px;background:rgba(16,21,34,.74);border:1px solid var(--line);border-radius:99px;color:var(--coral);font-size:10px;letter-spacing:.11em}.game-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px 14px calc(12px + var(--safe-bottom));background:rgba(16,21,34,.96)}.control{min-height:48px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);font-size:21px;touch-action:none}.control.pause{font-size:13px;color:var(--muted)}.result{text-align:center;padding-top:60px}.result .result-mark{font-size:58px;color:var(--mint);line-height:1}.result h1{margin:13px auto 0;font-size:40px}.result .reward{display:inline-flex;gap:13px;margin:22px 0;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.result .reward b{color:var(--sun)}.result-actions{display:grid;gap:9px;max-width:330px;margin:auto}.toast{position:fixed;z-index:40;top:calc(70px + var(--safe-top));left:50%;transform:translate(-50%,-12px);padding:10px 14px;border-radius:99px;background:var(--paper);color:var(--ink);font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}.reduced-motion *,.reduced-motion *:after,.reduced-motion *:before{transition-duration:.01ms!important;animation-duration:.01ms!important}.high-contrast{--line:rgba(255,255,255,.35);--muted:#d5def1}@media(min-width:540px){body{padding:0 12px}.app{min-height:100svh;border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)}}
  </style>
</head>
<body>
  <div class="app" id="app"><header class="topbar" id="topbar"></header><main id="screen"></main></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  // MVP mobile: loop solo determinístico + duelo local. Backend, IAP, ads e PvP online têm seams visíveis e estão listados nas pendências.
  const SAVE_KEY='skybound_mvp_v1',WORLD_START=560,GRAVITY=.52,JUMP=-11.7,PLAYER_W=25,PLAYER_H=30;
  const STAGES=[
    {id:'gardens',name:'Jardins Suspensos',min:0,gap:[54,86],bg:['#b7e6df','#dff7e7'],platform:'#396d63',accent:'#91f2bd',hazard:'vento'},
    {id:'forest',name:'Bosque Luminoso',min:120,gap:[58,95],bg:['#30566c','#1d344e'],platform:'#7ac58d',accent:'#ffd166',hazard:'vagalumes'},
    {id:'glass',name:'Picos de Vidro',min:280,gap:[63,104],bg:['#493b72','#201b43'],platform:'#a9b8e8',accent:'#ff846d',hazard:'fragmentos'},
    {id:'forge',name:'Forja Abissal',min:520,gap:[67,112],bg:['#752f35','#241523'],platform:'#e27d55',accent:'#ffd166',hazard:'calor'},
    {id:'orbit',name:'Estação Orbital',min:820,gap:[71,120],bg:['#1a3856','#081323'],platform:'#76b9ff',accent:'#91f2bd',hazard:'drones'},
    {id:'archipelago',name:'Arquipélago Celeste',min:1200,gap:[75,128],bg:['#314c78','#17213d'],platform:'#c0a4ff',accent:'#ffd166',hazard:'portais'}
  ];
  const COSMETICS=[
    {id:'sprout',name:'Broto',type:'avatar',color:'#91f2bd',price:0,free:true,glyph:'✦'},
    {id:'ember',name:'Brasa',type:'avatar',color:'#ff846d',price:90,glyph:'◆'},
    {id:'orbit',name:'Órbita',type:'avatar',color:'#76b9ff',price:140,glyph:'○'},
    {id:'sunset',name:'Pôr do Sol',type:'trail',color:'#ffd166',price:110,glyph:'≈'},
    {id:'violet',name:'Violeta',type:'trail',color:'#c0a4ff',price:160,glyph:'∿'},
    {id:'prism',name:'Prisma',type:'effect',color:'#f1f5ff',price:0,premium:true,glyph:'✧'}
  ];
  const DEFAULT_MISSIONS=[
    {id:'height',text:'Alcance 120 m em uma partida',goal:120,progress:0,reward:30,unit:' m'},
    {id:'runs',text:'Complete 3 partidas',goal:3,progress:0,reward:45,unit:''},
    {id:'coins',text:'Colete 12 fichas',goal:12,progress:0,reward:35,unit:''}
  ];
  const freshPlayer=()=>({version:1,coins:180,crystals:0,xp:0,level:1,best:0,unlockedStage:0,owned:['sprout'],equipped:'sprout',premium:false,noAds:false,missionsDate:'',missions:DEFAULT_MISSIONS.map(m=>({...m})),stats:{runs:0,wins:0,duels:0,highestStage:0},consent:null,prefs:{reducedMotion:false,highContrast:false,haptics:true,analytics:false}});
  let player=loadPlayer(),screenMode='home',runtime=null,raf=0,lastFrame=0,toastTimer=0,lastRunConfig={mode:'infinite',stageIndex:0};
  const screen=document.getElementById('screen'),topbar=document.getElementById('topbar'),toastEl=document.getElementById('toast');
  function loadPlayer(){try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'),base=freshPlayer();if(!saved)return base;const merged={...base,...saved,prefs:{...base.prefs,...(saved.prefs||{})},stats:{...base.stats,...(saved.stats||{})}};if(!Array.isArray(merged.missions)||merged.missions.length!==DEFAULT_MISSIONS.length)merged.missions=base.missions;resetDailyIfNeeded(merged);return merged}catch(_){return freshPlayer()}}
  function savePlayer(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(player))}catch(_){}}
  function resetDailyIfNeeded(target=player){const day=new Date().toISOString().slice(0,10);if(target.missionsDate!==day){target.missionsDate=day;target.missions=DEFAULT_MISSIONS.map(m=>({...m}));target.missionClaimed=[]}}
  function track(event,data={}){if(!player.prefs.analytics)return;try{const events=JSON.parse(localStorage.getItem('skybound_events')||'[]');events.push({event,data,at:new Date().toISOString(),version:1});localStorage.setItem('skybound_events',JSON.stringify(events.slice(-200)))}catch(_){}}
  function showToast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600)}
  function stageFor(meters){let index=0;STAGES.forEach((s,i)=>{if(meters>=s.min)index=i});return index}
  function currentCosmetic(){return COSMETICS.find(c=>c.id===player.equipped)||COSMETICS[0]}
  function applyPreferences(){document.documentElement.classList.toggle('reduced-motion',player.prefs.reducedMotion);document.documentElement.classList.toggle('high-contrast',player.prefs.highContrast)}
  function haptic(pattern=10){if(player.prefs.haptics&&navigator.vibrate)navigator.vibrate(pattern)}
  function escapeHtml(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
  function topbarHtml(){return `<div class="brand">SKY<span>BOUND</span></div><div class="wallet"><span class="wallet-chip"><b>◆</b> ${player.coins}</span><span class="wallet-chip"><b>✦</b> ${player.crystals}</span>${player.premium?'<span class="wallet-chip premium"><b>PRO</b></span>':''}</div>`}
  function navHtml(active){return `<nav class="bottom-nav" aria-label="Navegação principal"><button class="nav-item ${active==='home'?'active':''}" data-nav="home"><b>⌂</b>Início</button><button class="nav-item ${active==='journey'?'active':''}" data-nav="journey"><b>↟</b>Jornada</button><button class="nav-item ${active==='shop'?'active':''}" data-nav="shop"><b>✦</b>Estilo</button><button class="nav-item ${active==='profile'?'active':''}" data-nav="profile"><b>◌</b>Perfil</button></nav>`}
  function render(){stopGame();applyPreferences();topbar.innerHTML=topbarHtml();resetDailyIfNeeded();if(screenMode==='home')renderHome();if(screenMode==='journey')renderJourney();if(screenMode==='shop')renderShop();if(screenMode==='profile')renderProfile();if(screenMode==='settings')renderSettings();if(screenMode==='daily')renderDaily();screen.insertAdjacentHTML('beforeend',navHtml(screenMode==='daily'?'journey':screenMode));if(player.consent===null&&screenMode==='home')renderConsent()}
  function renderHome(){const count=player.missions.filter(m=>m.progress>=m.goal).length;screen.innerHTML=`<section class="hero"><div class="eyebrow">Temporada 01 · Horizonte</div><h1>Suba além do<br><em>próximo salto.</em></h1><p class="lede">Uma corrida vertical de precisão. Escolha seu estilo, leia o ritmo e deixe sua marca no céu.</p><div style="display:flex;gap:9px;margin-top:20px"><button class="button" data-action="journey">Jogar jornada</button><button class="button secondary" data-action="infinite">Infinito</button></div></section><div class="grid two"><button class="card interactive" data-action="daily" data-mark="24"><span class="arrow">↗</span><h3>Desafio diário</h3><p>Uma seed. Três metas. O mesmo céu para todos.</p><span class="tag">${count}/3 metas</span></button><button class="card interactive" data-action="duel" data-mark="VS"><span class="arrow">↗</span><h3>Duelo 1x1</h3><p>Corrida espelhada contra um rival local.</p><span class="tag">simulação offline</span></button></div><div class="section-head"><h2>Missões de hoje</h2><small>${count}/3 concluídas</small></div><div class="grid">${missionsHtml()}</div><div class="section-head"><h2>Seu salto</h2><small>nível ${player.level}</small></div><div class="card"><div class="character"><div class="avatar" style="--avatar:${currentCosmetic().color}">${currentCosmetic().glyph}</div><div style="flex:1"><h3>${escapeHtml(currentCosmetic().name)}</h3><p style="color:var(--muted);font-size:12px">Recorde: <b style="color:var(--paper)">${player.best} m</b></p><div class="progress" style="margin-top:9px"><i style="width:${Math.min(100,player.xp%100)}%"></i></div></div><button class="button small secondary" data-action="shop">Editar</button></div></div>`}
  function missionsHtml(){return player.missions.map((m,i)=>{const done=m.progress>=m.goal;return `<div class="card mission"><div class="mission-icon">${done?'✓':String(i+1).padStart(2,'0')}</div><div><h3>${escapeHtml(m.text)}</h3><div class="progress" style="margin-top:7px"><i style="width:${Math.min(100,m.progress/m.goal*100)}%"></i></div></div><span class="value">${done?'pronto':`${Math.min(m.progress,m.goal)}${m.unit}/${m.goal}${m.unit}`}</span></div>`}).join('')}
  function renderJourney(){const cards=STAGES.map((s,i)=>{const locked=i>player.unlockedStage;const best=player.stats.highestStage>i?'✓':'—';return `<button class="card stage-card ${locked?'locked':''}" style="--stage:linear-gradient(145deg,${s.bg[0]},${s.bg[1]})" data-stage="${i}" ${locked?'disabled':''}><div class="stage-top"><span>zona ${String(i+1).padStart(2,'0')}</span><span>${locked?'🔒':'livre'}</span></div><div><h3>${escapeHtml(s.name)}</h3><p>${escapeHtml(s.hazard)} · ${i===0?'entrada':'desafio crescente'}</p></div><div class="stage-foot"><span>${best==='✓'?'completado':`a partir de ${s.min} m`}</span><span class="tag">jogar ↗</span></div></button>`}).join('');screen.innerHTML=`<div class="screen-title"><button class="back" data-action="home">‹</button><div><div class="eyebrow">Mapa de ascensão</div><h2>Jornada</h2></div></div><p class="lede">Cada zona introduz uma regra nova. As metas são suas; o visual é só seu.</p><div class="grid" style="margin-top:16px">${cards}</div><div class="notice" style="margin-top:14px">As fases são geradas por seed e validadas para manter uma rota alcançável.</div>`}
  function renderDaily(){screen.innerHTML=`<div class="screen-title"><button class="back" data-action="home">‹</button><div><div class="eyebrow">Seed #${dailySeed()}</div><h2>Desafio diário</h2></div></div><div class="card" style="margin-top:18px;background:linear-gradient(145deg,#2f4b68,#15253e)"><div class="eyebrow">Regras de hoje</div><h2 style="margin-top:8px">Rota de lanternas</h2><p class="lede">Colete fichas e mantenha o combo. Uma tentativa pontuada por sessão.</p><div class="grid two" style="margin-top:17px"><div><div class="eyebrow">melhor</div><h2>${Math.max(0,player.best-12)} m</h2></div><div><div class="eyebrow">bônus</div><h2 style="color:var(--sun)">+50 ◆</h2></div></div></div><div class="section-head"><h2>Metas</h2><small>reinicia diariamente</small></div><div class="grid">${missionsHtml()}</div><button class="button wide" style="margin-top:15px" data-action="start-daily">Começar desafio</button>`}
  function renderShop(){const premium=player.premium;screen.innerHTML=`<div class="screen-title"><button class="back" data-action="home">‹</button><div><div class="eyebrow">Identidade em movimento</div><h2>Estilo</h2></div></div><div class="card" style="margin-top:17px;border-color:${premium?'var(--mint)':'var(--coral)'}"><div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><div class="eyebrow">Acesso premium</div><h3 style="margin-top:5px">${premium?'Clube Skybound ativo':'Mais expressão, mesmo jogo'}</h3><p class="lede" style="margin-top:5px">${premium?'Sem intersticiais · cosméticos mensais · estatísticas avançadas':'Sem atributos pagos. Só estilo, conforto e conteúdo visual.'}</p></div><span class="tag">${premium?'ATIVO':'DEMO LOCAL'}</span></div>${premium?'':'<button class="button coral small" style="margin-top:13px" data-action="premium-demo">Ativar Premium demo</button>'}</div><div class="section-head"><h2>Cosméticos</h2><small>${player.owned.length}/${COSMETICS.length} desbloqueados</small></div><div class="cosmetic-grid">${COSMETICS.map(c=>cosmeticHtml(c)).join('')}</div><div class="notice" style="margin-top:14px">Compras reais via App Store e Google Play ainda dependem das contas e servidores de produção. Esta tela usa apenas saldo local de demonstração.</div>`}
  function cosmeticHtml(c){const owned=player.owned.includes(c.id),equipped=player.equipped===c.id;return `<button class="cosmetic ${equipped?'equipped':''}" data-cosmetic="${c.id}"><span class="swatch" style="--swatch:${c.color}">${c.glyph}</span>${c.premium&&!owned?'<span class="lock">PRO</span>':''}<h3>${escapeHtml(c.name)}</h3><small>${equipped?'equipado':owned?'tocar para equipar':c.premium?'Premium':`${c.price} fichas`}</small></button>`}
  function renderProfile(){screen.innerHTML=`<div class="screen-title"><div><div class="eyebrow">Central de voo</div><h2>Perfil</h2></div><button class="back" data-action="settings" aria-label="Configurações">⚙</button></div><div class="card" style="margin-top:17px"><div class="character"><div class="avatar" style="--avatar:${currentCosmetic().color}">${currentCosmetic().glyph}</div><div><h3>Piloto convidado</h3><p style="color:var(--muted);font-size:12px">ID local · pronto para vincular conta</p></div></div><div class="grid two" style="margin-top:17px"><div><div class="eyebrow">nível</div><h2>${player.level}</h2></div><div><div class="eyebrow">recorde</div><h2>${player.best} m</h2></div></div></div><div class="section-head"><h2>Estatísticas</h2><small>desde o primeiro salto</small></div><div class="card"><div class="stat-row"><span>Partidas concluídas</span><b>${player.stats.runs}</b></div><div class="stat-row"><span>Duelo 1x1</span><b>${player.stats.duels}</b></div><div class="stat-row"><span>Vitórias</span><b>${player.stats.wins}</b></div><div class="stat-row"><span>Zona mais alta</span><b>${escapeHtml(STAGES[player.stats.highestStage]?.name||STAGES[0].name)}</b></div></div><div class="notice" style="margin-top:14px">O modo convidado salva neste aparelho. Login Apple/Google e sincronização entre aparelhos entram na etapa de backend.</div>`}
  function renderSettings(){const p=player.prefs,toggle=(key,title,desc)=>`<button class="toggle" data-toggle="${key}"><span><b>${title}</b><p>${desc}</p></span><span class="switch ${p[key]?'on':''}"><i></i></span></button>`;screen.innerHTML=`<div class="screen-title"><button class="back" data-action="profile">‹</button><div><div class="eyebrow">Controle da experiência</div><h2>Configurações</h2></div></div><div class="card" style="margin-top:18px">${toggle('reducedMotion','Reduzir movimento','Diminui shake e transições.')}${toggle('highContrast','Alto contraste','Reforça bordas e textos secundários.')}${toggle('haptics','Resposta tátil','Vibração curta em saltos e resultados.')}${toggle('analytics','Telemetria opcional','Registra eventos anônimos apenas localmente neste MVP.')}</div><div class="section-head"><h2>Dados</h2></div><div class="card"><button class="button secondary wide" data-action="export">Exportar diagnóstico local</button><button class="button secondary wide" style="margin-top:9px" data-action="reset">Recomeçar demo</button></div><div class="notice" style="margin-top:14px">Para excluir dados de produção, o app precisará do fluxo de conta e exclusão definido no roadmap.</div>`}
  function renderConsent(){document.body.insertAdjacentHTML('beforeend',`<aside class="consent" id="consent"><div class="eyebrow">Privacidade primeiro</div><p>Você pode jogar sem telemetria. Escolha se deseja permitir métricas anônimas para melhorar fases e estabilidade. A escolha fica neste aparelho.</p><div class="consent-actions"><button class="button secondary small" data-consent="reject">Agora não</button><button class="button small" data-consent="accept">Permitir métricas</button></div></aside>`)}
  function dailySeed(){const d=new Date();return Number(`${d.getUTCFullYear()}${String(d.getUTCMonth()+1).padStart(2,'0')}${String(d.getUTCDate()).padStart(2,'0')}`)%100000}
  function seeded(seed){let value=(seed>>>0)||1;return()=>{value=(value*1664525+1013904223)>>>0;return value/4294967296}}
  function begin(mode,stageIndex=0){lastRunConfig={mode,stageIndex};const seed=mode==='daily'?dailySeed():((Date.now()^(stageIndex*2654435761))>>>0);screenMode='game';renderGameShell(mode,stageIndex);const canvas=document.getElementById('game');runtime={mode,stageIndex,seed,rand:seeded(seed),canvas,ctx:canvas.getContext('2d'),width:360,height:640,frame:0,camera:0,maxY:480,lastPlatformY:570,platforms:[],particles:[],coins:[],targetX:180,left:false,right:false,paused:false,score:0,collected:0,opponent:mode==='duel'?{progress:0}:null,player:{x:168,y:480,vx:0,vy:0,w:PLAYER_W,h:PLAYER_H}};runtime.platforms.push({x:125,y:570,w:110,h:13,type:'start',phase:0});generatePlatforms(22);track('run_start',{mode,stage:stageIndex,seed});lastFrame=performance.now();raf=requestAnimationFrame(loop)}
  function renderGameShell(mode,stageIndex){screen.innerHTML=`<div class="game-shell"><div class="game-hud"><div class="metric"><small>altura</small><b id="hud-score">0 m</b></div><div class="stage-name" id="hud-stage">${mode==='duel'?'DUELO 1X1':escapeHtml(STAGES[stageIndex].name)}</div><button class="button small secondary" data-action="pause">pausar</button></div><div class="game-canvas-wrap"><canvas id="game" width="360" height="640" aria-label="Área de jogo"></canvas>${mode==='duel'?'<div class="duel-label">RIVAL LOCAL · MESMA SEED</div>':''}</div><div class="game-controls"><button class="control" data-control="left" aria-label="Mover para esquerda">‹</button><button class="control pause" data-action="pause">TOQUE E ARRASTE PARA GUIAR</button><button class="control" data-control="right" aria-label="Mover para direita">›</button></div></div>`}
  function stopGame(){if(raf)cancelAnimationFrame(raf);raf=0;runtime=null}
  function generatePlatforms(count){if(!runtime)return;const s=STAGES[runtime.stageIndex];for(let i=0;i<count;i++){const gap=s.gap[0]+Math.floor(runtime.rand()*(s.gap[1]-s.gap[0])),y=runtime.lastPlatformY-gap,w=58+Math.floor(runtime.rand()*42),x=Math.max(6,Math.min(360-w-6,Math.floor(runtime.rand()*(360-w)))),moving=runtime.stageIndex>0&&runtime.rand()<.18;runtime.platforms.push({x,y,w,h:13,type:moving?'moving':'normal',phase:runtime.rand()*6,baseX:x,amp:moving?Math.min(42,10+runtime.rand()*32):0,speed:.015+runtime.rand()*.02});if(runtime.rand()<.36)runtime.coins.push({x:x+w/2,y:y-22,r:6,got:false,spin:runtime.rand()*5});runtime.lastPlatformY=y}}
  function loop(now){if(!runtime)return;const dt=Math.min(2.2,Math.max(.45,(now-lastFrame)/16.666));lastFrame=now;if(!runtime.paused){update(dt);draw()}raf=requestAnimationFrame(loop)}
  function update(dt){const r=runtime,p=r.player;r.frame+=dt;const steer=r.left?-1:r.right?1:0;if(steer)p.vx+=steer*.65*dt;else p.vx*=Math.pow(.78,dt);if(Math.abs(r.targetX-(p.x+p.w/2))>4&&!steer)p.vx+=Math.sign(r.targetX-(p.x+p.w/2))*.25*dt;p.vx=Math.max(-6.5,Math.min(6.5,p.vx));p.x+=p.vx*dt;if(p.x<-p.w)p.x=360;if(p.x>360)p.x=-p.w;const oldBottom=p.y+p.h;p.vy+=GRAVITY*dt;p.y+=p.vy*dt;r.platforms.forEach(pl=>{if(pl.type==='moving')pl.x=pl.baseX+Math.sin(r.frame*pl.speed+pl.phase)*pl.amp});if(p.vy>0)for(const pl of r.platforms){const hit=p.x+p.w>pl.x&&p.x<pl.x+pl.w&&oldBottom<=pl.y+3&&p.y+p.h>=pl.y;if(hit){p.y=pl.y-p.h;p.vy=JUMP;burst(p.x+p.w/2,pl.y,STAGES[r.stageIndex].accent);haptic(7);break}}r.score=Math.max(r.score,Math.floor((WORLD_START-p.y)/10));if(p.y<r.maxY){r.maxY=p.y;if(r.mode==='duel')r.opponent.progress=Math.min(1,r.opponent.progress+.0017+r.rand()*.0012)}const desiredCamera=Math.min(0,p.y-255);if(desiredCamera<r.camera)r.camera+=(desiredCamera-r.camera)*.12*dt;if(r.platforms[r.platforms.length-1].y>r.camera-900)generatePlatforms(14);r.coins.forEach(c=>{if(!c.got&&p.x+p.w>c.x-c.r&&p.x<c.x+c.r&&p.y+p.h>c.y-c.r&&p.y<c.y+c.r){c.got=true;r.collected++;burst(c.x,c.y,'#ffd166')}});r.particles=r.particles.filter(q=>q.life>0);r.particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.08*dt;q.life-=dt});const target=r.mode==='journey'?105+r.stageIndex*44:r.mode==='daily'?180:Infinity;if((r.mode==='journey'||r.mode==='daily')&&r.score>=target)return endRun('complete');if(p.y-r.camera>700)return endRun('fall');updateHud()}
  function updateHud(){if(!runtime)return;const score=document.getElementById('hud-score');if(score)score.textContent=`${runtime.score} m`;const stage=document.getElementById('hud-stage');if(stage&&runtime.mode!=='duel')stage.textContent=STAGES[Math.min(STAGES.length-1,stageFor(runtime.score))].name}
  function burst(x,y,color){if(!runtime||player.prefs.reducedMotion)return;for(let i=0;i<5;i++)runtime.particles.push({x,y,vx:(runtime.rand()-.5)*2.8,vy:-1-runtime.rand()*2,life:18+runtime.rand()*16,color})}
  function draw(){const r=runtime,ctx=r.ctx,s=STAGES[Math.min(STAGES.length-1,stageFor(r.score))];ctx.clearRect(0,0,360,640);const grad=ctx.createLinearGradient(0,0,0,640);grad.addColorStop(0,s.bg[0]);grad.addColorStop(1,s.bg[1]);ctx.fillStyle=grad;ctx.fillRect(0,0,360,640);ctx.globalAlpha=.17;for(let i=0;i<18;i++){const x=(i*83+Math.sin(r.frame*.01+i)*24)%390,y=(i*47+r.camera*.12)%680;ctx.fillStyle=s.accent;ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;r.platforms.forEach(pl=>{const y=pl.y-r.camera;if(y<-24||y>650)return;ctx.fillStyle=pl.type==='moving'?s.accent:s.platform;roundRect(ctx,pl.x,y,pl.w,pl.h,6);ctx.fill();ctx.fillStyle='rgba(255,255,255,.28)';roundRect(ctx,pl.x+5,y+2,Math.max(4,pl.w*.25),3,2);ctx.fill()});r.coins.forEach(c=>{const y=c.y-r.camera;if(c.got||y<-15||y>655)return;ctx.save();ctx.translate(c.x,y);ctx.rotate(Math.sin(r.frame*.1+c.spin)*.4);ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8d6118';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.fillText('◆',0,3);ctx.restore()});if(r.mode==='duel'){const oy=510-r.opponent.progress*300;ctx.globalAlpha=.42;ctx.fillStyle='#ff846d';roundRect(ctx,250,oy,PLAYER_W,PLAYER_H,8);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#ff846d';ctx.font='bold 10px sans-serif';ctx.fillText('RIVAL',248,oy-7)}r.particles.forEach(q=>{ctx.globalAlpha=Math.max(0,q.life/30);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y-r.camera,3,3)});ctx.globalAlpha=1;const c=currentCosmetic(),p=r.player,py=p.y-r.camera;ctx.save();ctx.translate(p.x+p.w/2,py+p.h/2);ctx.rotate(Math.max(-.2,Math.min(.2,p.vx*.035)));ctx.fillStyle=c.color;roundRect(ctx,-p.w/2,-p.h/2,p.w,p.h,8);ctx.fill();ctx.fillStyle='#101522';ctx.beginPath();ctx.arc(-5,-3,2,0,Math.PI*2);ctx.arc(5,-3,2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#101522';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,3,6,0,Math.PI);ctx.stroke();ctx.restore()}
  function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  function endRun(reason){if(!runtime)return;const r=runtime,duel=r.mode==='duel',win=duel&&(r.score>=Math.floor(r.opponent.progress*240)||reason==='complete');player.stats.runs++;if(duel){player.stats.duels++;if(win)player.stats.wins++}player.best=Math.max(player.best,r.score);player.stats.highestStage=Math.max(player.stats.highestStage,Math.min(STAGES.length-1,stageFor(r.score)));player.unlockedStage=Math.min(STAGES.length-1,Math.max(player.unlockedStage,stageFor(r.score)));player.coins+=Math.min(45,5+Math.floor(r.score/14)+(duel&&win?12:0));player.xp+=Math.min(70,10+Math.floor(r.score/8));player.level=Math.max(1,Math.floor(player.xp/100)+1);updateMissions(r.score,r.collected);savePlayer();track('run_end',{mode:r.mode,score:r.score,reason,duelWin:win});haptic(reason==='complete'?[15,40,15]:25);runtime=null;if(raf)cancelAnimationFrame(raf);raf=0;screenMode='result';renderResult({reason,score:r.score,collected:r.collected,win,mode:r.mode,stageIndex:r.stageIndex})}
  function updateMissions(score,collected){player.missions[0].progress=Math.max(player.missions[0].progress,score);player.missions[1].progress=Math.min(player.missions[1].goal,player.missions[1].progress+1);player.missions[2].progress=Math.min(player.missions[2].goal,player.missions[2].progress+collected)}
  function renderResult(data){const title=data.mode==='duel'?(data.win?'Vitória no duelo':'Quase lá'):(data.reason==='complete'?'Zona conquistada':'Salto encerrado'),subtitle=data.mode==='duel'?(data.win?'Você leu melhor a rota.':'O rival chegou primeiro desta vez.'):(data.reason==='complete'?'A próxima rota foi desbloqueada.':'Cada queda deixa uma pista para o próximo salto.');screen.innerHTML=`<section class="result"><div class="result-mark">${data.mode==='duel'?(data.win?'✦':'×'):(data.reason==='complete'?'↑':'∿')}</div><div class="eyebrow">${data.mode==='duel'?'resultado 1x1':data.reason==='complete'?'meta alcançada':'fim da tentativa'}</div><h1>${title}</h1><p class="lede" style="margin:12px auto 0">${subtitle}</p><div class="reward"><span><b>${data.score} m</b><small> altura</small></span><span><b>+${Math.min(45,5+Math.floor(data.score/14)+(data.win?12:0))}</b><small> fichas</small></span><span><b>${data.collected}</b><small> coletadas</small></span></div><div class="result-actions"><button class="button" data-action="retry">Tentar de novo</button><button class="button secondary" data-action="home">Voltar ao início</button><button class="button secondary" data-action="share-result">Compartilhar resultado</button><button class="button secondary" data-action="rewarded-demo">Ver anúncio demo · +10 fichas</button></div></section>`}
  function buyOrEquip(id){const c=COSMETICS.find(x=>x.id===id);if(!c)return;if(c.premium&&!player.premium){showToast('Este visual faz parte do Premium.');return}if(!player.owned.includes(id)){if(player.coins<c.price){showToast('Fichas insuficientes.');return}player.coins-=c.price;player.owned.push(id);showToast(`${c.name} desbloqueado.`)}player.equipped=id;savePlayer();track('cosmetic_equipped',{id});render()}
  function togglePref(key){player.prefs[key]=!player.prefs[key];savePlayer();track('consent_updated',{enabled:player.prefs.analytics});render()}
  function exportData(){const payload={player:{...player,prefs:{...player.prefs}},generatedAt:new Date().toISOString()};navigator.clipboard?.writeText(JSON.stringify(payload,null,2)).then(()=>showToast('Diagnóstico copiado.')).catch(()=>showToast('Diagnóstico pronto no console.'));console.info('Skybound diagnostic',payload)}
  function resetDemo(){if(confirm('Recomeçar a demonstração e perder o progresso local?')){localStorage.removeItem(SAVE_KEY);player=freshPlayer();savePlayer();render()}}
  document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){screenMode=nav.dataset.nav;render();return}const consent=e.target.closest('[data-consent]');if(consent){player.consent=consent.dataset.consent==='accept';player.prefs.analytics=player.consent;savePlayer();document.getElementById('consent')?.remove();track('consent_updated',{enabled:player.prefs.analytics});return}const toggle=e.target.closest('[data-toggle]');if(toggle){togglePref(toggle.dataset.toggle);return}const cosmetic=e.target.closest('[data-cosmetic]');if(cosmetic){buyOrEquip(cosmetic.dataset.cosmetic);return}const stage=e.target.closest('[data-stage]');if(stage){begin('journey',Number(stage.dataset.stage));return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='home'){screenMode='home';render()}else if(action==='journey'){screenMode='journey';render()}else if(action==='shop'){screenMode='shop';render()}else if(action==='profile'){screenMode='profile';render()}else if(action==='settings'){screenMode='settings';render()}else if(action==='daily'){screenMode='daily';render()}else if(action==='start-daily'){begin('daily',stageFor(player.best))}else if(action==='infinite'){begin('infinite',stageFor(player.best))}else if(action==='duel'){begin('duel',Math.min(3,stageFor(player.best)))}else if(action==='pause'){if(runtime){runtime.paused=!runtime.paused;showToast(runtime.paused?'Pausa':'Continuar')}}else if(action==='retry'){begin(lastRunConfig.mode,lastRunConfig.stageIndex)}else if(action==='share-result'){const shareText="Skybound // Ascensão — alcancei um novo salto.";if(navigator.share){navigator.share({title:"Skybound",text:shareText}).then(()=>track("share_result",{channel:"native"})).catch(()=>{})}else{navigator.clipboard?.writeText(shareText).then(()=>showToast("Resultado copiado."));track("share_result",{channel:"clipboard"})}}else if(action==='rewarded-demo'){const key="skybound_ad_demo_"+new Date().toISOString().slice(0,10);if(sessionStorage.getItem(key)){showToast("Recompensa diária já usada.")}else{player.coins+=10;sessionStorage.setItem(key,"1");savePlayer();track("ad_result",{placement:"result",mode:"demo"});showToast("Recompensa de anúncio demo concedida.")}}else if(action==='premium-demo'){player.premium=true;player.noAds=true;savePlayer();showToast('Premium demo ativado neste aparelho.');render()}else if(action==='export'){exportData()}else if(action==='reset'){resetDemo()}});
  document.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-control]');if(c&&runtime){runtime[c.dataset.control]=true;return}if(e.target.id==='game'&&runtime){const rect=e.target.getBoundingClientRect();runtime.targetX=(e.clientX-rect.left)*(360/rect.width)}});
  document.addEventListener('pointermove',e=>{if(e.target.id==='game'&&runtime){const rect=e.target.getBoundingClientRect();runtime.targetX=Math.max(0,Math.min(360,(e.clientX-rect.left)*(360/rect.width)))}});
  document.addEventListener('pointerup',e=>{const c=e.target.closest('[data-control]');if(c&&runtime)runtime[c.dataset.control]=false});
  document.addEventListener('keydown',e=>{if(!runtime)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')runtime.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')runtime.right=true;if(e.key==='Escape')runtime.paused=!runtime.paused});
  document.addEventListener('keyup',e=>{if(!runtime)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')runtime.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')runtime.right=false});
  resetDailyIfNeeded();applyPreferences();render();
  </script>
