  function drawCharacter() {
    const c = character;
    if (!c) return;
    ctx.save();
    if (state === 'dying') {
      // Tumbling corpse
      ctx.translate(c.x + c.w / 2, c.y - cameraY + c.h / 2);
      ctx.rotate(c.rot || 0);
      drawDoodler(-c.w / 2, -c.h / 2, c.w, c.h, c.facing);
    } else {
      const sy = c.y - cameraY;

      // Soft shadow (screen space)
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      ctx.beginPath();
      ctx.ellipse(c.x + c.w / 2, sy + c.h + 3, c.w * 0.4, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Squash & stretch anchored at the feet
      let syy = 1 + clamp((Math.abs(c.vy) - 5) * 0.02, 0, 0.3);
      let sxx = 1 / Math.sqrt(syy);
      const sq = c.squash > 0 ? c.squash : 0;
      syy *= (1 - 0.4 * sq);
      sxx *= (1 + 0.35 * sq);

      ctx.translate(c.x + c.w / 2, sy + c.h);
      ctx.scale(sxx, syy);
      drawDoodler(-c.w / 2, -c.h, c.w, c.h, c.facing);
    }
    ctx.restore();
    if (shieldReady && state === 'playing') {
      const sx=character.x+character.w/2,sy=character.y-cameraY+character.h/2,r=Math.max(character.w,character.h)*.78;
      const pulse=.72+Math.sin(tick*.16)*.18;
      ctx.save();ctx.globalAlpha=pulse;ctx.strokeStyle='#c9bdff';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(sx,sy-r);ctx.lineTo(sx+r*.72,sy-r*.38);ctx.lineTo(sx+r*.58,sy+r*.62);ctx.lineTo(sx,sy+r);ctx.lineTo(sx-r*.58,sy+r*.62);ctx.lineTo(sx-r*.72,sy-r*.38);ctx.closePath();ctx.stroke();
      ctx.globalAlpha=.14;ctx.fillStyle='#9987ff';ctx.fill();ctx.restore();
    }
    if (webTimer > 0 && state === 'playing') {
      const sx=c.x+c.w/2, sy=c.y-cameraY+c.h/2, r=Math.max(c.w,c.h)*.68;
      ctx.save();ctx.strokeStyle='rgba(245,250,255,.88)';ctx.lineWidth=1.5;
      for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r);ctx.stroke();}
      for(const rr of [.35,.7,1]){ctx.beginPath();ctx.arc(sx,sy,r*rr,0,Math.PI*2);ctx.stroke();}ctx.restore();
    }
  }

  function characterGrid(){
    const columns=Math.min(5,CHARACTERS.length),cw=62,gap=7,cardH=64,rowGap=8;
    return {columns,cw,gap,cardH,rowGap,sx:(W-(columns*cw+(columns-1)*gap))/2,top:278};
  }

  function characterCardAt(x,y){
    const grid=characterGrid(),row=Math.floor((y-grid.top)/(grid.cardH+grid.rowGap)),column=Math.floor((x-grid.sx)/(grid.cw+grid.gap));
    if(row<0||column<0||column>=grid.columns||y>grid.top+row*(grid.cardH+grid.rowGap)+grid.cardH||x>grid.sx+column*(grid.cw+grid.gap)+grid.cw)return -1;
    const index=row*grid.columns+column;
    return index<CHARACTERS.length?index:-1;
  }

    ctx.save();ctx.translate(W/2,170);ctx.scale(2.15,2.15);const old=selectedCharacter;selectedCharacter=hero.id;drawDoodler(-20,-24,40,48,1);selectedCharacter=old;ctx.restore();
    ctx.fillStyle=hero.color;ctx.font='800 20px "Segoe UI",sans-serif';ctx.fillText(hero.name,W/2,250);
    CHARACTERS.forEach((item,i)=>{const row=Math.floor(i/grid.columns),column=i%grid.columns,x=grid.sx+column*(grid.cw+grid.gap),y=grid.top+row*(grid.cardH+grid.rowGap);roundRect(x,y,grid.cw,grid.cardH,10);ctx.fillStyle=i===characterSel?'rgba(126,231,135,.22)':'rgba(255,255,255,.07)';ctx.fill();ctx.strokeStyle=i===characterSel?item.color:'rgba(255,255,255,.16)';ctx.lineWidth=i===characterSel?2:1;ctx.stroke();ctx.save();ctx.translate(x+grid.cw/2,y+11);ctx.scale(.72,.72);const prev=selectedCharacter;selectedCharacter=item.id;drawDoodler(-20,0,40,48,1);selectedCharacter=prev;ctx.restore()});
    menuPrompt('← → ou ↑ ↓ escolher  ·  ESPAÇO usar  ·  ESC voltar',452);ctx.fillStyle='#aebbd3';ctx.font='500 13px "Segoe UI",sans-serif';ctx.fillText('No celular, toque em uma personagem',W/2,486);
  }

  function drawHelpScreen() {
    menuBackdrop(0.62);
    menuTitle('COMO JOGAR', 130);
    const lines = [
      '← → ou A D para se mover',
      'P ou ESC para pausar',
      'Molas te lançam mais alto',
      'Foguetes dão voo temporário',
      'Setas azuis acumulam pulos extras altos',
      'Escudos lilás bloqueiam um monstro',
      'Pule sobre monstros para usá-los de trampolim',
      'Cuidado com os monstros!',
      '6 fases, cada uma mais difícil'
    ];
    ctx.font = '500 17px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#cdd8f0';
    lines.forEach((line, i) => ctx.fillText(line, W / 2, 200 + i * 29));
    menuPrompt('ESPAÇO ou ESC para voltar', 462);
  }

  function drawPauseScreen() {
    menuBackdrop(0.6);
    menuTitle('PAUSADO', 178);
    PAUSE_ITEMS.forEach((it, i) => drawMenuItem(it, 285 + i * 52, pauseSel === i));
    menuPrompt('↑ ↓ escolher   ·   ESPAÇO confirmar   ·   P continuar', 460);
  }

  function drawStageBanner() {
    if (!stageBanner || (state !== 'playing' && state !== 'dying')) return;
    const b = stageBanner;
    let a;
    if (b.t < 18) a = b.t / 18;
    else if (b.t > 105) a = Math.max(0, (135 - b.t) / 30);
    else a = 1;
    if (a <= 0) return;
    const dy = b.t < 18 ? (18 - b.t) * 2 : 0;

    ctx.save();
    ctx.globalAlpha = a;
    roundRect(W / 2 - 135, 62 + dy, 270, 56, 14);
    ctx.fillStyle = 'rgba(10,16,28,0.55)';
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffd54f';
    ctx.font = '800 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('FASE ' + (b.idx + 1) + ' DE ' + STAGES.length, W / 2, 62 + dy + 15);
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 22px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(b.name.toUpperCase(), W / 2, 62 + dy + 37);
    ctx.restore();
  }

  function drawUI() {
    if (state !== 'start' && state !== 'help') {
      // Score on a soft pill so it stays readable over any sky
      roundRect(8, 8, 124, 64, 12);
      ctx.fillStyle = 'rgba(10,16,28,0.35)';
      ctx.fill();

      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const size = Math.round(26 * (1 + 0.35 * scorePulse));
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = '800 ' + size + 'px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(score + ' m', 16, 16);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('recorde ' + best + ' m', 16, 48);
      if (webTimer > 0) {
        roundRect(W / 2 - 72, 80, 144, 34, 17); ctx.fillStyle='rgba(45,32,55,.78)'; ctx.fill();
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='800 14px "Segoe UI",sans-serif';
        ctx.fillText('PRESO NA TEIA  '+Math.ceil(webTimer/60)+'s',W/2,97);
      }
      let powerY = webTimer > 0 ? 118 : 80;
      if (extraJumpCharges > 0 && state === 'playing') {
        roundRect(W / 2 - 104, powerY, 208, 30, 15); ctx.fillStyle='rgba(19,91,117,.82)'; ctx.fill();
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#d8fbff';ctx.font='800 12px "Segoe UI",sans-serif';
        ctx.fillText('↟ PULOS EXTRAS ×' + extraJumpCharges + ' · TOQUE',W/2,powerY+15);
        powerY += 36;
      }
      if (shieldReady && state === 'playing') {
        roundRect(W / 2 - 96, powerY, 192, 30, 15); ctx.fillStyle='rgba(70,54,128,.84)'; ctx.fill();
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#eeeaff';ctx.font='800 12px "Segoe UI",sans-serif';
        ctx.fillText('◈ ESCUDO · BLOQUEIA 1 MONSTRO',W/2,powerY+15);
      }

      // Current stage label (top-right)
      if (state === 'playing' || state === 'dying') {
        const s = STAGES[stageIdx];
        roundRect(W - 172, 14, 158, 22, 11);
        ctx.fillStyle = 'rgba(10,16,28,0.35)';
        ctx.fill();
        ctx.textAlign = 'right';
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.font = '700 12px "Segoe UI", system-ui, sans-serif';
        ctx.fillText('FASE ' + (stageIdx + 1) + ' · ' + s.name.toUpperCase(), W - 24, 19);
      }
    }

    if (state === 'start') {
      drawMenuScreen();
    } else if (state === 'customize') {
      drawCustomizeScreen();
    } else if (state === 'help') {
      drawHelpScreen();
    } else if (state === 'paused') {
      drawPauseScreen();
    } else if (state === 'gameover') {
      drawGameOverScreen();
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.4, rand(-shake, shake) * 0.4);

    drawBackground();
    drawFarClouds();
    drawClouds();
    drawAmbient();

    for (const p of platforms) {
      const sy = p.y - cameraY;
      if (sy > -p.h - 12 && sy < H + 10) {
        drawPlatform(p, sy);
        if (p.spring && !p.broken) drawSpring(p, sy);
      }
    }

    for (const p of pickups) drawPickup(p);
    for (const e of enemies) drawEnemy(e);

    drawCharacter();
    drawParticles();

    ctx.restore();

    drawVignette();
    drawUI();
    drawStageBanner();
  }

  // ---------- Input ----------
  function setKey(e, down) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keys.left = down;
      if (down) inputMode = 'keys';
      return true;
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keys.right = down;
      if (down) inputMode = 'keys';
      return true;
    }
    return false;
  }

  function tryStart() {
    if (state === 'gameover') startGame();
  }

  function togglePause() {
    if (state === 'playing') { state = 'paused'; pauseSel = 0; }
    else if (state === 'paused') state = 'playing';
  }

  // Confirms the highlighted option in whichever screen is up
  function confirmAction() {
    if (state === 'start') {
      if(menuSel===0)startGame();else if(menuSel===1){characterSel=CHARACTERS.findIndex(c=>c.id===selectedCharacter);state='customize'}else state='help';
    } else if(state==='customize'){selectedCharacter=CHARACTERS[characterSel].id;state='start';
    } else if (state === 'help') {
      state = 'start';
    } else if (state === 'paused') {
      if (pauseSel === 0) state = 'playing';
      else if (pauseSel === 1) startGame();
      else { reset(); menuSel = 0; state = 'start'; }
    } else {
      tryStart(); // gameover
    }
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if ((k === 'p' || k === 'P' || k === 'Escape') && (state === 'playing' || state === 'paused')) {
      togglePause();
      e.preventDefault();
      return;
    }
    if (state === 'help' && (k === 'Escape' || k === 'p' || k === 'P')) {
      state = 'start';
      e.preventDefault();
      return;
    }
    if(state==='customize'){const columns=characterGrid().columns;if(k==='Escape'){state='start';e.preventDefault();return}if(k==='ArrowLeft'||k==='a'||k==='A'){characterSel=(characterSel+CHARACTERS.length-1)%CHARACTERS.length;e.preventDefault();return}if(k==='ArrowRight'||k==='d'||k==='D'){characterSel=(characterSel+1)%CHARACTERS.length;e.preventDefault();return}if(k==='ArrowUp'||k==='w'||k==='W'){characterSel=(characterSel+CHARACTERS.length-columns)%CHARACTERS.length;e.preventDefault();return}if(k==='ArrowDown'||k==='s'||k==='S'){characterSel=(characterSel+columns)%CHARACTERS.length;e.preventDefault();return}}
    if (state === 'gameover' && (k === 's' || k === 'S')) {
      shareResult();
      e.preventDefault();
      return;
    }
    if ((state === 'start' || state === 'paused') && (k === 'ArrowUp' || k === 'w' || k === 'W')) {
      const n = state === 'start' ? MENU_ITEMS.length : PAUSE_ITEMS.length;
      if (state === 'start') menuSel = (menuSel + n - 1) % n;
      else pauseSel = (pauseSel + n - 1) % n;
      e.preventDefault();
      return;
    }
    if ((state === 'start' || state === 'paused') && (k === 'ArrowDown' || k === 's' || k === 'S')) {
      const n = state === 'start' ? MENU_ITEMS.length : PAUSE_ITEMS.length;
      if (state === 'start') menuSel = (menuSel + 1) % n;
      else pauseSel = (pauseSel + 1) % n;
      e.preventDefault();
      return;
    }
    if (state === 'playing' && k === ' ') {
      tryExtraJump();
      e.preventDefault();
      return;
    }
    if (k === ' ' || k === 'Enter') {
      confirmAction();
      e.preventDefault();
      return;
    }
    if (setKey(e, true)) e.preventDefault();
  });

  document.addEventListener('keyup', (e) => {
    setKey(e, false);
  });

  function pointerX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  canvas.addEventListener('mousemove', (e) => {
    mouseX = pointerX(e.clientX);
    inputMode = 'mouse';
  });

  canvas.addEventListener('mouseleave', () => {
    mouseX = null;
  });

  function menuPointer(clientX,clientY){
    const rect=canvas.getBoundingClientRect(),x=(clientX-rect.left)*(W/rect.width),y=(clientY-rect.top)*(H/rect.height);
    if(state==='start'){
      const i=Math.round((y-280)/50);
      if(i>=0&&i<MENU_ITEMS.length&&Math.abs(y-(280+i*50))<=24){menuSel=i;confirmAction();}
      return;
    }
    if(state==='paused'){
      const i=Math.round((y-285)/52);
      if(i>=0&&i<PAUSE_ITEMS.length&&Math.abs(y-(285+i*52))<=24){pauseSel=i;confirmAction();}
      return;
    }
    if(state==='gameover'){
      if(x>=48&&x<=W-48&&y>=354&&y<=396)shareResult();
      else confirmAction();
      return;
    }
    if(state!=='customize'){confirmAction();return;}
    const characterIndex=characterCardAt(x,y);
    if(characterIndex>=0){characterSel=characterIndex;}
    else if(y>=435){confirmAction();}
    else characterSel=(characterSel+1)%CHARACTERS.length;
  }

  canvas.addEventListener('click',e=>{
    if (state === 'playing') { tryExtraJump(); return; }
    menuPointer(e.clientX,e.clientY);
  });

  canvas.addEventListener('touchstart', (e) => {
    if(state!=='playing'){e.preventDefault();menuPointer(e.touches[0].clientX,e.touches[0].clientY);return;}
    e.preventDefault();
    mouseX = pointerX(e.touches[0].clientX);
    inputMode = 'mouse';
    tryExtraJump();
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    mouseX = pointerX(e.touches[0].clientX);
    inputMode = 'mouse';
  }, { passive: false });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- Responsive scaling ----------
  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const availW = window.innerWidth - 20;
    const availH = window.innerHeight - titleEl.offsetHeight - hintEl.offsetHeight - 48;
    const s = Math.max(0.5, Math.min(availW / W, availH / H));
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
  }

  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', fitCanvas);

  // ---------- Fixed-timestep game loop ----------
  let lastTime = 0;
  const STEP = 1000 / 60;
  let accumulator = 0;

  function loop(time) {
    if (!lastTime) lastTime = time;
    let dt = time - lastTime;
    lastTime = time;
    if (dt > 100) dt = 100; // clamp after tab switches
    accumulator += dt;
    while (accumulator >= STEP) {
      update();
      accumulator -= STEP;
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Boot ----------
  initClouds();
  initStars();
  initScenery();
  reset();
  fitCanvas();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
