<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Doodle Jump</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(1200px 800px at 50% -10%, #243b55 0%, #141e30 60%, #0d1420 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #eaf0ff;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: clamp(18px, 4.5vh, 26px);
    margin-bottom: 10px;
    letter-spacing: 4px;
    font-weight: 800;
    background: linear-gradient(90deg, #7ee787, #56ccf2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .game-wrap {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  }
  canvas {
    display: block;
    background: #eaf4ff;
    cursor: crosshair;
  }
  .hint {
    margin-top: 12px;
    font-size: clamp(11px, 2.2vh, 13px);
    color: #8b93a7;
    letter-spacing: 0.3px;
    text-align: center;
    padding: 0 12px;
  }
  .hint b { color: #b9c4dd; font-weight: 600; }
  .credit {
    margin-top: 8px;
    font-size: clamp(10px, 2vh, 12px);
    color: #5c6478;
    letter-spacing: 0.3px;
    text-align: center;
  }
</style>
</head>
<body>
  <h1>DOODLE JUMP</h1>
  <div class="game-wrap">
    <canvas id="game" width="400" height="600"></canvas>
  </div>
  <div class="hint"><b>&larr; &rarr;</b> ou <b>A / D</b> ou <b>arraste</b> para mover &middot; <b>ESPA&ccedil;O</b> ou toque para come&ccedil;ar &middot; coleta azul: pulos extras acumul&aacute;veis &middot; coleta lil&aacute;s: escudo</div>
  <div class="credit">Feito com qwen3.8-27b@Q4_K_XL</div>

  <script>
  'use strict';

  // ---------- Canvas ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 400;   // logical size (independent of CSS scaling)
  const H = 600;
  const titleEl = document.querySelector('h1');
  const hintEl = document.querySelector('.hint');

  // ---------- Tuning constants ----------
  const GRAVITY        = 0.5;      // px / frame^2
  const JUMP_VELOCITY  = -12;      // px / frame (upward)
  const SPRING_VELOCITY= -20;      // big bounce on springs
  const ROCKET_VY      = -15;      // constant upward speed while rocketing
  const ROCKET_TIME    = 95;       // frames of flight (~1.6s)
  const EXTRA_JUMP_VELOCITY = -16.5; // stronger optional midair jump from a collectible
  const STOMP_VELOCITY = -15;      // rebound after jumping on a monster
  const MAX_JUMP_HEIGHT= (JUMP_VELOCITY * JUMP_VELOCITY) / (2 * GRAVITY); // 144px
  const MOVE_SPEED     = 5;        // px / frame (arrow keys)
  const MOUSE_SPEED    = 7;        // px / frame (mouse/touch follow)
  const PLATFORM_WIDTH = 72;
  const PLATFORM_HEIGHT= 16;
  const METER_SCALE    = 10;       // px per "meter" of score
  const BEST_SCORE_KEY = 'doodle-jump-best-score';
  const SCORE_HISTORY_KEY = 'doodle-jump-score-history';
  const MAX_SCORE_HISTORY = 10;

  // ---------- Stages (gradual difficulty by altitude, in meters) ----------
  // gapMax must stay below MAX_JUMP_HEIGHT (144px).
  const STAGES = [
    { name: 'Prado',     minScore: 0,    gapMin: 50, gapMax: 96,  spring: 0.08, moving: 0.00, enemy: 0.00, pickup: 0.050,
      enemySpeed: [1.0, 2.0], moveMult: 1.00, sky: ['#cfe8ff', '#e7f2ff', '#f4f9ff'], plat: { body: '#4caf50', top: '#7ed957', deco: 'grass' } },
    { name: 'Floresta',  minScore: 250,  gapMin: 54, gapMax: 106, spring: 0.11, moving: 0.16, enemy: 0.00, pickup: 0.045,
      enemySpeed: [1.0, 2.0], moveMult: 1.00, sky: ['#8fc7bd', '#bfe3d2', '#eaf6e9'], plat: { body: '#2e8b6a', top: '#5fbf92', deco: 'leaf' } },
    { name: 'Montanhas', minScore: 600,  gapMin: 58, gapMax: 114, spring: 0.13, moving: 0.20, enemy: 0.07, pickup: 0.040,
      enemySpeed: [1.2, 2.4], moveMult: 1.10, sky: ['#8fa7d9', '#ffc98a', '#ffe0bd'], plat: { body: '#7d8ea8', top: '#cdd9e8', deco: 'snow' } },
    { name: 'Cavernas',  minScore: 1000, gapMin: 62, gapMax: 120, spring: 0.14, moving: 0.26, enemy: 0.10, pickup: 0.040,
      enemySpeed: [1.5, 3.0], moveMult: 1.25, sky: ['#1d1740', '#3a2c5e', '#5a4470'], plat: { body: '#6b5a78', top: '#9c86ab', deco: 'crystal' } },
    { name: 'Vulcão',    minScore: 1500, gapMin: 66, gapMax: 128, spring: 0.12, moving: 0.30, enemy: 0.13, pickup: 0.035,
      enemySpeed: [1.8, 3.4], moveMult: 1.40, sky: ['#1a0b12', '#4a1620', '#8a2f1d'], plat: { body: '#9c3f24', top: '#e0703c', deco: 'lava' } },
    { name: 'Espaço',    minScore: 2000, gapMin: 70, gapMax: 132, spring: 0.10, moving: 0.34, enemy: 0.16, pickup: 0.030,
      enemySpeed: [2.0, 3.8], moveMult: 1.50, sky: ['#030510', '#070d1f', '#0e1730'], plat: { body: '#5b6fae', top: '#a9bcf0', deco: 'spark' } },
    { name: 'Planeta',   minScore: 3000, gapMin: 74, gapMax: 138, spring: 0.09, moving: 0.38, enemy: 0.19, pickup: 0.028,
      enemySpeed: [2.2, 4.2], moveMult: 1.65, sky: ['#0a1e2e', '#123c4f', '#1d5c6b'], plat: { body: '#2e7d8a', top: '#6fd3c7', deco: 'alien' } },
    { name: 'Nebulosa',  minScore: 4000, gapMin: 78, gapMax: 142, spring: 0.08, moving: 0.42, enemy: 0.22, pickup: 0.026,
      enemySpeed: [2.4, 4.6], moveMult: 1.80, sky: ['#1a0530', '#3d1157', '#6b2a8f'], plat: { body: '#7b4fae', top: '#c99af0', deco: 'nebula' } }
  ];

  function metersAt(y) { return Math.max(0, (H - 140 - y) / METER_SCALE); }
  function stageForMeters(m) {
    let i = 0;
    for (let k = 0; k < STAGES.length; k++) if (m >= STAGES[k].minScore) i = k;
    return i;
  }

  // ---------- Enemy types (minStage = first stage index where it can spawn) ----------
  const ENEMY_KINDS = {
    ptero: { minStage: 2, name: 'pterodáctilo' },
    slime: { minStage: 2, name: 'slime' },
    spider:{ minStage: 1, name: 'aranha' },
    bat:   { minStage: 3, name: 'morcego' },
    ghost: { minStage: 3, name: 'fantasma' },
    ufo:   { minStage: 5, name: 'OVNI' },
    robot: { minStage: 6, name: 'robô' },
    alien: { minStage: 6, name: 'alien' },
    comet: { minStage: 7, name: 'cometa' }
  };

  // ---------- State ----------
  let state = 'start';             // 'start' | 'help' | 'customize' | 'playing' | 'paused' | 'dying' | 'gameover'
  let menuSel = 0;                 // selected option in the main menu
  let pauseSel = 0;                // selected option in the pause menu
  const MENU_ITEMS = ['JOGAR', 'PERSONAGEM', 'COMO JOGAR'];
  const CHARACTERS=[
    {id:'doodler',name:'DOODLER',color:'#7ee787'},
    {id:'spiderman',name:'HOMEM-ARANHA',color:'#ef3340'},
    {id:'ironman',name:'HOMEM DE FERRO',color:'#f6c445'},
    {id:'captain',name:'CAPITÃO AMÉRICA',color:'#5aa9e6'},
    {id:'hulk',name:'HULK',color:'#72c05b'},
    {id:'luna',name:'LUNA',color:'#b79cff'},
    {id:'maya',name:'MAYA',color:'#4fd1c5'},
    {id:'sol',name:'SOL',color:'#ff8a72'},
    {id:'iris',name:'ÍRIS',color:'#ff9ed8'}
  ];
  let characterSel=0,selectedCharacter='doodler';
  const PAUSE_ITEMS = ['CONTINUAR', 'REINICIAR', 'MENU PRINCIPAL'];
  let character = null;
  let platforms = [];
  let enemies = [];
  let pickups = [];
  let particles = [];
  let cameraY = 0;                 // world-y at the top of the visible screen
  let highestY = 0;
  let score = 0;
  let best = loadBestScore();
  let scoreHistory = loadScoreHistory();
  best = Math.max(best, ...scoreHistory.map(entry => entry.score));
  let lastRunWasRecord = false;
  let shareFeedback = '';
  let shareFeedbackTimer = 0;
  let inputMode = null;            // 'keys' | 'mouse'
  let mouseX = null;
  const keys = { left: false, right: false };

  let tick = 0;                    // frame counter (fixed timestep)
  let rocketTimer = 0;             // frames of rocket flight remaining
  let extraJumpCharges = 0;        // accumulated extra jumps from cyan collectibles
  let shieldReady = false;         // blocks one monster collision from the violet collectible
  let webTimer = 0;                // frames stuck in a spider web (4 seconds)
  let deathTimer = 0;
  let deathCause = 'fall';         // 'fall' | 'enemy'
  let killerKind = null;           // kind of the enemy that killed you
  let shake = 0;                   // screen-shake frames remaining
  let scorePulse = 0;              // HUD pop animation
  let lastPulseAt = 0;
  let skyT = 0;                    // 0..(STAGES.length-1): continuous stage position for the sky blend
  let stageIdx = 0;                // current stage index (banner trigger + HUD)
  let stageBanner = null;          // { idx, name, t } — transition announcement
  let blinkTimer = 240;
  let blinkClosed = false;

  // Decorative parallax clouds + stars
  const clouds = [];
  const farClouds = [];
  const stars = [];
  // Per-stage scenery (screen-space, wrapped with vertical parallax)
  const trees = [];        // Floresta: tree silhouettes on the edges
  const ridgeFar = [];     // Montanhas: distant peaks
  const ridgeNear = [];    // Montanhas: near peaks
  const volcanoes = [];    // Vulcão: cones on the edges
  const planets = [];      // Espaço: planet / moon / nebula
  const spires = [];       // Planeta: crystal spires on the edges
  const gasClouds = [];    // Nebulosa: drifting gas blobs
  const caveWalls = { left: [], right: [] };
  let caveTopFar = [], caveTopNear = [], caveBotFar = [], caveBotNear = [], caveGems = [];
  const ambient = [];      // per-stage ambient particles (screen space)

  // ---------- Helpers ----------
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rand(min, max) { return min + Math.random() * (max - min); }

  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mixHex(a, b, t) {
    const A = hexToRgb(a), B = hexToRgb(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
                    Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
                    Math.round(A[2] + (B[2] - A[2]) * t) + ')';
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  // Flying enemies wrap around the left/right edges
  function wrapEnemy(e) {
    if (e.vx > 0 && e.x > W + 20) e.x = -20 - e.w;
    else if (e.vx < 0 && e.x < -20 - e.w) e.x = W + 20;
  }

  // Storage is deliberately best-effort: the game still runs in private or
  // restricted browser contexts where localStorage may be unavailable.
  function storageGet(key) {
    try { return typeof localStorage === 'undefined' ? null : localStorage.getItem(key); }
    catch (_) { return null; }
  }

  function storageSet(key, value) {
    try { if (typeof localStorage !== 'undefined') localStorage.setItem(key, value); }
    catch (_) { /* Storage is optional for gameplay. */ }
  }

  function loadBestScore() {
    const value = Number(storageGet(BEST_SCORE_KEY));
    return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
  }

  function loadScoreHistory() {
    try {
      const saved = JSON.parse(storageGet(SCORE_HISTORY_KEY) || '[]');
      if (!Array.isArray(saved)) return [];
      return saved.filter(entry => entry && Number.isFinite(Number(entry.score))).slice(0, MAX_SCORE_HISTORY).map(entry => ({
        score: Math.max(0, Math.floor(Number(entry.score))),
        stage: Math.max(1, Math.floor(Number(entry.stage) || 1)),
        character: typeof entry.character === 'string' ? entry.character : 'doodler',
        cause: entry.cause === 'enemy' ? 'enemy' : 'fall',
        at: Number(entry.at) || 0
      }));
    } catch (_) { return []; }
  }

  function persistScores() {
    storageSet(BEST_SCORE_KEY, String(best));
    storageSet(SCORE_HISTORY_KEY, JSON.stringify(scoreHistory));
  }

  // ---------- Sky (blends between stage skies with altitude) ----------
  function skyTForScore(s) {
    const n = STAGES.length - 1;
    if (s >= STAGES[n].minScore) return n;
    for (let i = 0; i < n; i++) {
      if (s < STAGES[i + 1].minScore) {
        const span = STAGES[i + 1].minScore - STAGES[i].minScore;
        return i + (s - STAGES[i].minScore) / span;
      }
    }
    return n;
  }
  function skyColors(t) {
    const n = STAGES.length - 1;
    t = clamp(t, 0, n);
    const i = Math.min(Math.floor(t), n - 1);
    const k = t - i;
    return {
      top: mixHex(STAGES[i].sky[0], STAGES[i + 1].sky[0], k),
      mid: mixHex(STAGES[i].sky[1], STAGES[i + 1].sky[1], k),
      bot: mixHex(STAGES[i].sky[2], STAGES[i + 1].sky[2], k)
    };
  }
  function cloudFill(t, mult) {
    const fade = clamp(1 - Math.max(0, t - 3.5) / 1.5, 0, 1); // gone in space
    if (fade <= 0) return null;
    const c = clamp(t / 2, 0, 1);                       // white -> dusk blue
    const A = hexToRgb('#ffffff'), B = hexToRgb('#39496e');
    return 'rgba(' + Math.round(A[0] + (B[0] - A[0]) * c) + ',' +
                   Math.round(A[1] + (B[1] - A[1]) * c) + ',' +
                   Math.round(A[2] + (B[2] - A[2]) * c) + ',' + (0.55 * fade * mult).toFixed(3) + ')';
  }

  // Smooth in/out window used to cross-fade scenery layers between stages
  function fadeWindow(t, a, b, ramp) {
    if (t <= a || t >= b) return 0;
    return clamp(Math.min((t - a) / ramp, (b - t) / ramp), 0, 1);
  }

  // ---------- Particles ----------
  function spawnBurst(x, y, n, color, speed, gravity) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = rand(0.35, 1) * speed;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - speed * 0.3,
        life: rand(20, 45), maxLife: 45,
        color: color, size: rand(1.5, 3.5),
        g: gravity === undefined ? 0.15 : gravity
      });
    }
    if (particles.length > 260) particles.splice(0, particles.length - 260);
  }

  function spawnFlame(x, y) {
    for (let i = 0; i < 2; i++) {
      const life = rand(12, 22);
      particles.push({
        x: x + rand(-5, 5), y: y + rand(0, 4),
        vx: rand(-0.6, 0.6), vy: rand(1.2, 3),
        life: life, maxLife: life,
        color: Math.random() < 0.5 ? '#ff9d3b' : '#ffd54f',
        size: rand(2, 4), g: -0.02
      });
    }
    if (particles.length > 260) particles.splice(0, particles.length - 260);
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      if (--p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y - cameraY, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Ambient particles (per-stage atmosphere, screen space) ----------
  const AMBIENT_TYPES = ['fluff', 'leaf', 'snow', 'spore', 'ember', 'shoot', 'dust', 'stardust'];
  const AMBIENT_RATE = [0.10, 0.09, 0.13, 0.08, 0.16, 0.012, 0.10, 0.08];
  const AMBIENT_CAP  = [24, 22, 30, 20, 30, 5, 26, 30];

  function spawnAmbient(type) {
    if (type === 'shoot') {
      const fromLeft = Math.random() < 0.5;
      ambient.push({ type: type, x: fromLeft ? -20 : W + 20, y: rand(30, H * 0.4), vx: (fromLeft ? 1 : -1) * rand(6, 9), vy: rand(1.2, 2.2), life: 70, maxLife: 70 });
      return;
    }
    const rising = type === 'spore' || type === 'ember' || type === 'dust' || type === 'stardust';
    const p = {
      type: type,
      x: Math.random() * W,
      y: rising ? H + rand(4, 30) : -rand(4, 30),
      vy: 0,
      phase: Math.random() * Math.PI * 2,
      size: type === 'fluff' ? rand(1.8, 3.4) : type === 'snow' ? rand(1, 2.4) : type === 'leaf' ? rand(3, 5) : type === 'dust' ? rand(1.2, 2.4) : type === 'stardust' ? rand(1, 2.2) : rand(1.6, 3),
      color: null
    };
    if (type === 'fluff') p.vy = rand(0.35, 0.8);
    else if (type === 'leaf') { p.vy = rand(0.6, 1.2); p.color = ['#e8a13c', '#d97b2f', '#8fae4a'][Math.floor(Math.random() * 3)]; }
    else if (type === 'snow') p.vy = rand(0.45, 1.05);
    else if (type === 'spore') p.vy = -rand(0.3, 0.7);
    else if (type === 'dust') { p.vy = -rand(0.25, 0.6); p.color = ['#6fd3c7', '#9fe8dc'][Math.floor(Math.random() * 2)]; }
    else if (type === 'stardust') { p.vy = -rand(0.3, 0.8); p.color = ['#ff7fc4', '#c99af0', '#7fd3f0'][Math.floor(Math.random() * 3)]; }
    else p.vy = -rand(0.8, 1.9); // ember
    ambient.push(p);
  }

  function updateAmbient() {
    const di = Math.round(clamp(skyT, 0, STAGES.length - 1));
    if (ambient.length < AMBIENT_CAP[di] && Math.random() < AMBIENT_RATE[di]) spawnAmbient(AMBIENT_TYPES[di]);
    for (let i = ambient.length - 1; i >= 0; i--) {
      const p = ambient[i];
      if (p.type === 'shoot') {
        p.x += p.vx;
        p.y += p.vy;
        if (--p.life <= 0 || p.x < -60 || p.x > W + 60) ambient.splice(i, 1);
        continue;
      }
      const sway = Math.sin(tick * 0.025 + p.phase);
      p.x += (p.type === 'fluff' ? -0.25 : 0) + sway * (p.type === 'leaf' ? 0.9 : 0.45);
      p.y += p.vy;
      if (p.y < -40 || p.y > H + 40 || p.x < -30 || p.x > W + 30) ambient.splice(i, 1);
    }
  }

  function drawAmbient() {
    for (const p of ambient) {
      if (p.type === 'shoot') {
        const a = clamp(p.life / p.maxLife, 0, 1);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * a).toFixed(2) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 7, p.y - p.vy * 7);
        ctx.stroke();
      } else if (p.type === 'fluff') {
        ctx.globalAlpha = 0.65;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'leaf') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.sin(tick * 0.04 + p.phase) * 1.2);
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else if (p.type === 'snow') {
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'spore') {
        const tw = 0.5 + 0.5 * Math.sin(tick * 0.06 + p.phase);
        ctx.fillStyle = '#7fe3ff';
        ctx.globalAlpha = 0.18 + 0.3 * tw;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.5 + 0.4 * tw;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'dust') {
        const tw = 0.5 + 0.5 * Math.sin(tick * 0.05 + p.phase);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.12 + 0.2 * tw;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.4 + 0.35 * tw;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'stardust') {
        const tw = 0.5 + 0.5 * Math.sin(tick * 0.09 + p.phase);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.14 + 0.26 * tw;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.5 + 0.45 * tw;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      } else { // ember
        const fl = 0.6 + 0.4 * Math.sin(tick * 0.3 + p.phase);
        ctx.globalAlpha = 0.5 + 0.45 * fl;
        ctx.fillStyle = Math.random() < 0.5 ? '#ff9d3b' : '#ffd54f';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Setup ----------
  function initClouds() {
    clouds.length = 0;
    for (let i = 0; i < 9; i++) {
      clouds.push({ x: Math.random() * W, y: Math.random() * H, r: 14 + Math.random() * 26, drift: rand(0.08, 0.3) });
    }
    farClouds.length = 0;
    for (let i = 0; i < 7; i++) {
      farClouds.push({ x: Math.random() * W, y: Math.random() * H, r: 8 + Math.random() * 12, drift: rand(0.04, 0.15) });
    }
  }

  function initStars() {
    stars.length = 0;
    for (let i = 0; i < 46; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: rand(0.6, 1.8),
        phase: Math.random() * Math.PI * 2,
        a: rand(0.5, 1)
      });
    }
  }

  function makeRidge(peaks, hMin, hMax) {
    const pts = [];
    for (let i = 0; i <= peaks; i++) pts.push({ x: (W / peaks) * i + rand(-8, 8), h: rand(hMin, hMax) });
    return pts;
  }

  function initScenery() {
    trees.length = 0;
    for (let i = 0; i < 8; i++) {
      const left = i % 2 === 0;
      trees.push({ x: left ? rand(14, 52) : W - rand(14, 52), y: Math.random() * (H + 90), s: rand(0.8, 1.35), variant: Math.floor(Math.random() * 2) });
    }

    ridgeFar.length = 0;
    ridgeNear.length = 0;
    for (let i = 0; i < 2; i++) {
      ridgeFar.push({ y: i * (H + 140) / 2, pts: makeRidge(4, 34, 88) });
      ridgeNear.push({ y: i * (H + 140) / 2, pts: makeRidge(5, 46, 110) });
    }

    caveWalls.left.length = 0;
    caveWalls.right.length = 0;
    for (let y = -10; y <= H + 20; y += 46) {
      caveWalls.left.push({ y: y + rand(-8, 8), d: rand(12, 30) });
      caveWalls.right.push({ y: y + rand(-8, 8), d: rand(12, 30) });
    }
    caveTopFar = []; caveTopNear = []; caveBotFar = []; caveBotNear = []; caveGems = [];
    for (let i = 0; i < 7; i++) caveTopFar.push({ x: rand(8, W - 8), w: rand(16, 34), len: rand(50, 95) });
    for (let i = 0; i < 5; i++) caveTopNear.push({ x: rand(8, W - 8), w: rand(20, 42), len: rand(26, 58) });
    for (let i = 0; i < 6; i++) caveBotFar.push({ x: rand(8, W - 8), w: rand(18, 36), len: rand(40, 80) });
    for (let i = 0; i < 4; i++) caveBotNear.push({ x: rand(8, W - 8), w: rand(22, 44), len: rand(24, 52) });
    for (let i = 0; i < 7; i++) {
      const left = Math.random() < 0.5;
      caveGems.push({ x: left ? rand(10, 34) : W - rand(10, 34), y: rand(40, H - 40), phase: Math.random() * Math.PI * 2 });
    }

    volcanoes.length = 0;
    for (let i = 0; i < 4; i++) {
      const left = i % 2 === 0;
      volcanoes.push({ x: left ? rand(30, 90) : W - rand(30, 90), y: Math.random() * (H + 160), s: rand(0.85, 1.3) });
    }

    planets.length = 0;
    const types = ['ringed', 'moon', 'nebula'];
    for (let i = 0; i < 3; i++) {
      planets.push({ x: rand(60, W - 60), y: Math.random() * (H + 200), type: types[i], s: rand(0.85, 1.2) });
    }

    spires.length = 0;
    for (let i = 0; i < 8; i++) {
      const left = i % 2 === 0;
      spires.push({ x: left ? rand(16, 54) : W - rand(16, 54), y: Math.random() * (H + 90), s: rand(0.8, 1.4), hue: Math.floor(Math.random() * 3) });
    }

    gasClouds.length = 0;
    for (let i = 0; i < 4; i++) {
      gasClouds.push({ x: rand(40, W - 40), y: Math.random() * (H + 160), s: rand(0.8, 1.5), hue: Math.floor(Math.random() * 3) });
    }
  }

  function generatePlatform(topY) {
    const stIdx = stageForMeters(metersAt(topY));
    const S = STAGES[stIdx];
    const gap = rand(S.gapMin, S.gapMax);
    const y = topY - gap;
    const x = rand(0, W - PLATFORM_WIDTH);
    const p = { x: x, y: y, w: PLATFORM_WIDTH, h: PLATFORM_HEIGHT, moving: false, spring: false, springT: 0, brittle: false, breaking: 0, broken: false, breakAge: 0, theme: stIdx };

    // New content only above the safe starting zone
    if (y < H - 160) {
      if (Math.random() < 0.13) p.brittle = true;
      else if (Math.random() < S.spring) p.spring = true;
      else if (Math.random() < S.moving) {
        p.moving = true;
        p.baseX = x;
        p.range = rand(30, Math.min(90, W - PLATFORM_WIDTH - 20));
        p.speed = rand(0.8, 1.8) * S.moveMult;
        p.phase = Math.random() * Math.PI * 2;
      }
    }
    platforms.push(p);

    // Enemy flying between this platform and the one below it
    if (y < H - 320 && Math.random() < S.enemy) {
      const kinds = Object.keys(ENEMY_KINDS).filter(k => stIdx >= ENEMY_KINDS[k].minStage);
      const kind = kinds[Math.floor(Math.random() * kinds.length)];
      const dir = Math.random() < 0.5 ? 1 : -1;
      const ey = y + gap * rand(0.25, 0.75);
      const e = {
        kind: kind,
        x: rand(0, W - 40),
        y: ey, baseY: ey,
        vx: dir * rand(S.enemySpeed[0], S.enemySpeed[1]),
        vy: 0,
        phase: Math.random() * Math.PI * 2
      };
      if (kind === 'slime')   {
        e.w = 34; e.h = 28;
        // A gosma começa patrulhando lateralmente: o jogador consegue ler a
        // trajetória em vez de enfrentar um obstáculo imóvel no caminho.
        e.vx = dir * rand(0.45, 0.8);
        e.vy = -rand(4.5, 6.5);
        e.seen = false;
        e.spawnGrace = 0;
      }
      else if (kind === 'spider') { e.w = 32; e.h = 26; e.vx = dir * rand(0.7, 1.3); }
      else if (kind === 'bat')    { e.w = 30; e.h = 22; e.vx *= 1.25; }
      else if (kind === 'ghost')  { e.w = 30; e.h = 34; e.vx = dir * rand(0.4, 0.9); }
      else if (kind === 'ufo')    { e.w = 40; e.h = 24; e.vx *= 1.5; }
      else if (kind === 'robot')  { e.w = 34; e.h = 28; e.vx *= 0.9; }
      else if (kind === 'alien')  { e.w = 34; e.h = 28; e.vx = 0; e.vy = -rand(4.5, 6.2); }
      else if (kind === 'comet')  { e.w = 30; e.h = 20; e.vx *= 1.7; }
      else                        { e.w = 36; e.h = 26; } // ptero
      enemies.push(e);
    }

    // Collectibles floating between platforms. Each has a different recovery role.
    if (y < H - 400 && Math.random() < S.pickup) {
      pickups.push({
        type: 'rocket',
        x: rand(20, W - 44),
        y: y + gap * rand(0.35, 0.65),
        w: 22, h: 30,
        phase: Math.random() * Math.PI * 2
      });
    } else if (y < H - 280 && Math.random() < S.pickup * 0.65) {
      pickups.push({
        type: 'extraJump',
        x: rand(20, W - 44),
        y: y + gap * rand(0.35, 0.65),
        w: 28, h: 28,
        phase: Math.random() * Math.PI * 2
      });
    } else if (y < H - 260 && Math.random() < S.pickup * 0.45) {
      pickups.push({
        type: 'shield',
        x: rand(20, W - 44),
        y: y + gap * rand(0.35, 0.65),
        w: 28, h: 28,
        phase: Math.random() * Math.PI * 2
      });
    }

    return y;
  }

  function reset() {
    character = {
      x: W / 2 - 20,
      y: H - 140,
      w: 40,
      h: 48,
      vx: 0,
      vy: 0,
      facing: 1,
      squash: 0,
      rot: 0
    };
    platforms = [];
    enemies = [];
    pickups = [];
    particles = [];
    // First platform centered under the character
    const firstY = H - 80;
    platforms.push({ x: W / 2 - PLATFORM_WIDTH / 2, y: firstY, w: PLATFORM_WIDTH, h: PLATFORM_HEIGHT, moving: false, spring: false, springT: 0, theme: 0 });
    // Pre-generate a buffer of platforms above the screen
    let topY = firstY;
    while (topY > -H * 2) topY = generatePlatform(topY);

    cameraY = 0;
    highestY = character.y;
    score = 0;
    rocketTimer = 0;
    extraJumpCharges = 0;
    shieldReady = false;
    webTimer = 0;
    deathCause = 'fall';
    killerKind = null;
    shake = 0;
    scorePulse = 0;
    lastPulseAt = 0;
    skyT = 0;
    stageIdx = 0;
    stageBanner = null;
    lastRunWasRecord = false;
    shareFeedback = '';
    shareFeedbackTimer = 0;
  }

  function startGame() {
    reset();
    state = 'playing';
  }

  function saveRunResult() {
    const previousBest = best;
    best = Math.max(best, score);
    lastRunWasRecord = score > previousBest;
    scoreHistory.unshift({
      score,
      stage: stageIdx + 1,
      character: selectedCharacter,
      cause: deathCause,
      at: Date.now()
    });
    scoreHistory = scoreHistory.slice(0, MAX_SCORE_HISTORY);
    persistScores();
  }

  function die(cause, kind) {
    if (state !== 'playing') return;
    state = 'dying';
    deathTimer = 55;
    deathCause = cause;
    killerKind = kind || null;
    saveRunResult();
    shake = 12;
    spawnBurst(character.x + character.w / 2, character.y + character.h / 2, 26, '#8ee06a', 4);
  }

  function setShareFeedback(message) {
    shareFeedback = message;
    shareFeedbackTimer = 180;
  }

  function resultShareText() {
    const stage = STAGES[stageIdx];
    const prefix = lastRunWasRecord ? 'Novo recorde!' : 'Minha partida acabou!';
    return prefix + ' Fiz ' + score + ' m no Doodle Jump, na fase ' + (stageIdx + 1) + ' (' + stage.name + '). Meu recorde é ' + best + ' m.';
  }

  async function shareResult() {
    if (state !== 'gameover') return false;
    const text = resultShareText();
    const url = typeof location === 'undefined' ? '' : location.href;
    try {
      if (typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
        await navigator.share({ title: 'Doodle Jump', text, url });
        setShareFeedback('Resultado compartilhado!');
        return true;
      }
      if (typeof navigator !== 'undefined' && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        await navigator.clipboard.writeText(text + (url ? ' ' + url : ''));
        setShareFeedback('Resultado copiado!');
        return true;
      }
      if (typeof window !== 'undefined' && typeof window.prompt === 'function') {
        window.prompt('Copie seu resultado:', text + (url ? ' ' + url : ''));
        setShareFeedback('Copie o resultado para compartilhar.');
        return true;
      }
    } catch (error) {
      if (!error || error.name !== 'AbortError') setShareFeedback('Não foi possível compartilhar agora.');
      return false;
    }
    setShareFeedback('Não foi possível compartilhar agora.');
    return false;
  }

  // Each cyan collectible adds one charge. A charge can be spent on the ascent
  // or descent, but never overrides rocket flight or the web.
  function tryExtraJump() {
    if (extraJumpCharges <= 0 || state !== 'playing' || rocketTimer > 0 || webTimer > 0 || !character) return false;
    extraJumpCharges--;
    character.vy = EXTRA_JUMP_VELOCITY;
    character.squash = 0.45;
    spawnBurst(character.x + character.w / 2, character.y + character.h / 2, 16, '#8cf5ff', 3.1);
    shake = Math.max(shake, 3);
    return true;
  }

  // ---------- Update ----------
  function update() {
    if (state === 'paused') return; // world frozen while paused
    tick++;

    // Timers that run in every state
    if (shake > 0) shake--;
    if (stageBanner) { stageBanner.t++; if (stageBanner.t > 140) stageBanner = null; }
    if (shareFeedbackTimer > 0 && --shareFeedbackTimer === 0) shareFeedback = '';
    scorePulse = scorePulse > 0.01 ? scorePulse * 0.9 : 0;
    if (character && character.squash > 0) character.squash = Math.max(0, character.squash - 0.12);

    updateAmbient();

    // Blinking
    if (state === 'dying' || state === 'gameover') {
      blinkClosed = true;
    } else if (--blinkTimer <= 0) {
      blinkClosed = !blinkClosed;
      blinkTimer = blinkClosed ? 6 : rand(140, 320);
    }

    updateParticles();

    if (state === 'playing') {
      // --- Horizontal control ---
      if (webTimer > 0) { webTimer--; character.vx = 0; character.vy = 0; }
      else if (inputMode === 'keys') {
        if (keys.left && keys.right) {
          character.vx = 0;
        } else if (keys.left) {
          character.vx = -MOVE_SPEED;
          character.facing = -1;
        } else if (keys.right) {
          character.vx = MOVE_SPEED;
          character.facing = 1;
        } else {
          character.vx = 0;
        }
      } else if (inputMode === 'mouse' && mouseX !== null) {
        const target = mouseX - character.w / 2;
        const diff = target - character.x;
        if (Math.abs(diff) > 2) {
          character.vx = Math.sign(diff) * Math.min(MOUSE_SPEED, Math.abs(diff));
          character.facing = Math.sign(diff);
        } else {
          character.vx = 0;
        }
      } else {
        character.vx = 0;
      }

      // --- Physics (rocket overrides gravity and ignores platforms) ---
      if (webTimer > 0) { character.vx = 0; character.vy = 0; }
      else if (rocketTimer > 0) {
        rocketTimer--;
        character.vy = ROCKET_VY;
        spawnFlame(character.x + character.w / 2, character.y + character.h);
      } else {
        character.vy += GRAVITY;
      }
      character.x += character.vx;
      character.y += character.vy;

      // Wrap around the left/right edges
      if (character.x + character.w < 0) character.x = W;
      else if (character.x > W) character.x = -character.w;

      // --- Moving platforms ---
      for (const p of platforms) {
        if (p.breaking > 0 && --p.breaking === 0) {
          p.broken = true; p.fallVy = 1.5; p.breakAge = 0;
          spawnBurst(p.x + p.w / 2, p.y + p.h / 2, 14, '#c89555', 3);
        }
        if (p.broken) { p.breakAge++; p.y += p.fallVy; p.fallVy += 0.32; continue; }
        if (p.moving) {
          const nx = p.baseX + Math.sin(tick * p.speed * 0.02 + p.phase) * p.range;
          p.x = clamp(nx, 0, W - p.w);
        }
        if (p.springT > 0) p.springT--;
      }

      // --- Platform collision (only while falling, not while rocketing) ---
      if (character.vy > 0 && rocketTimer <= 0) {
        const feet = character.y + character.h;
        const prevFeet = feet - character.vy;
        for (const p of platforms) {
          if (p.broken || p.breaking > 0) continue;
          if (
            character.x + character.w > p.x &&
            character.x < p.x + p.w &&
            prevFeet <= p.y + 1 &&
            feet >= p.y
          ) {
            character.y = p.y - character.h;
            const cx = character.x + character.w / 2;
            if (p.spring && Math.abs(cx - (p.x + p.w / 2)) < 16) {
              character.vy = SPRING_VELOCITY;
              p.springT = 12;
              spawnBurst(cx, p.y, 14, '#ffd54f', 3);
            } else {
              character.vy = JUMP_VELOCITY;
              spawnBurst(cx, p.y, 5, '#ffffff', 1.6, 0.08);
            }
            character.squash = 1;
            if (p.brittle) p.breaking = 14;
            break;
          }
        }
      }

      // --- Enemies (invincible while rocketing) ---
      const hitbox = { x: character.x + 4, y: character.y + 4, w: character.w - 8, h: character.h - 6 };
      for (const e of enemies) {
        if (e.kind === 'slime') {
          // Hops while patrolling sideways, reversing only at the visible edges.
          // The short grace period begins when it first enters the screen, not
          // when it was generated offscreen, so its movement is readable.
          if (!e.seen && e.y - cameraY > -e.h && e.y - cameraY < H + e.h) {
            e.seen = true;
            e.spawnGrace = 24;
          }
          if (e.spawnGrace > 0) e.spawnGrace--;
          e.x += e.vx;
          if (e.x < 2) { e.x = 2; e.vx = Math.abs(e.vx); }
          else if (e.x > W - e.w - 2) { e.x = W - e.w - 2; e.vx = -Math.abs(e.vx); }
          e.vy += 0.32;
          e.y += e.vy;
          if (e.y >= e.baseY) { e.y = e.baseY; e.vy = -rand(4.5, 6.5); }
        } else if (e.kind === 'spider') {
          // crawls sideways while dangling slightly on its web
          e.x += e.vx;
          if (e.x < 2 || e.x > W - e.w - 2) { e.vx = -e.vx; e.x = clamp(e.x, 2, W - e.w - 2); }
          e.y = e.baseY + Math.sin(tick * 0.08 + e.phase) * 10;
        } else if (e.kind === 'bat') {
          // fast crossing with a sine bob
          e.x += e.vx; wrapEnemy(e);
          e.y = e.baseY + Math.sin(tick * 0.18 + e.phase) * 16;
        } else if (e.kind === 'ghost') {
          // slow drift that homes toward the player's x
          const want = clamp(Math.sign((character.x + character.w / 2) - (e.x + e.w / 2)) * 0.7, -1.1, 1.1);
          e.vx += (want - e.vx) * 0.02;
          e.x += e.vx; wrapEnemy(e);
          e.y = e.baseY + Math.sin(tick * 0.1 + e.phase) * 12;
        } else if (e.kind === 'robot') {
          // patrols back and forth, turning at the screen edges
          e.x += e.vx;
          if (e.x < 2) { e.x = 2; e.vx = Math.abs(e.vx); }
          else if (e.x > W - 2 - e.w) { e.x = W - 2 - e.w; e.vx = -Math.abs(e.vx); }
          e.y = e.baseY + Math.sin(tick * 0.15 + e.phase) * 8;
        } else if (e.kind === 'alien') {
          // hops and drifts toward the player between bounces
          e.vy += 0.32;
          e.y += e.vy;
          e.x += e.vx;
          if (e.x < 0 || e.x > W - e.w) { e.vx = -e.vx; e.x = clamp(e.x, 0, W - e.w); }
          if (e.y >= e.baseY) {
            e.y = e.baseY;
            e.vy = -rand(4.5, 6.2);
            const want = Math.sign((character.x + character.w / 2) - (e.x + e.w / 2)) * 1.3;
            e.vx += (want - e.vx) * 0.45;
          }
        } else if (e.kind === 'comet') {
          // fast diagonal streak with a big vertical swing
          e.phase += 0.085;
          e.x += e.vx; wrapEnemy(e);
          e.y = e.baseY + Math.sin(e.phase) * 30;
        } else { // ptero, ufo
          e.x += e.vx; wrapEnemy(e);
          if (e.kind === 'ufo') e.y = e.baseY + Math.sin(tick * 0.12 + e.phase) * 24;
        }
        if (rocketTimer <= 0 && !e.webSpent && (!e.spawnGrace || e.spawnGrace <= 0) && aabb(hitbox, e)) {
          const feet = character.y + character.h;
          const prevFeet = feet - character.vy;
          const stompedFromAbove = character.vy > 0 && prevFeet <= e.y + Math.min(8, e.h * 0.3);
          if (stompedFromAbove) {
            // Landing on the top defeats the monster and turns it into a trampoline.
            character.y = e.y - character.h;
            character.vy = STOMP_VELOCITY;
            character.squash = 0.8;
            e.defeated = true;
            spawnBurst(e.x + e.w / 2, e.y + e.h / 2, 20, '#ffd54f', 3.6);
            shake = Math.max(shake, 5);
            continue;
          }
          if (shieldReady) {
            // One shield absorbs one whole monster encounter, including a spider web.
            shieldReady = false;
            e.defeated = true;
            spawnBurst(e.x + e.w / 2, e.y + e.h / 2, 22, '#b9a7ff', 3.7);
            spawnBurst(character.x + character.w / 2, character.y + character.h / 2, 14, '#e5ddff', 2.8);
            shake = Math.max(shake, 6);
            continue;
          }
          if (e.kind === 'spider') {
            webTimer = 240; e.webSpent = true; character.vx = 0; character.vy = 0; shake = 7;
            spawnBurst(character.x + character.w / 2, character.y + character.h / 2, 18, '#ffffff', 2.5);
          } else { die('enemy', e.kind); break; }
        }
      }
      enemies = enemies.filter(e => !e.defeated);

      // --- Collectibles ---
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        const off = Math.sin(tick * 0.06 + p.phase) * 4;
        if (aabb(hitbox, { x: p.x, y: p.y + off, w: p.w, h: p.h })) {
          if (p.type === 'extraJump') {
            extraJumpCharges++;
            spawnBurst(p.x + p.w / 2, p.y + p.h / 2, 16, '#8cf5ff', 3.1);
          } else if (p.type === 'shield') {
            shieldReady = true;
            spawnBurst(p.x + p.w / 2, p.y + p.h / 2, 18, '#b9a7ff', 3.2);
          } else {
            rocketTimer = ROCKET_TIME;
            character.vy = ROCKET_VY;
            spawnBurst(p.x + p.w / 2, p.y + p.h / 2, 18, '#ffd54f', 3.5);
          }
          pickups.splice(i, 1);
        }
      }

      // --- Camera follows upward only ---
      const targetCam = character.y - H * 0.4;
      if (targetCam < cameraY) cameraY = targetCam;

      // --- Score + HUD pulse every 10 m ---
      if (character.y < highestY) highestY = character.y;
      score = Math.max(score, Math.floor((H - 140 - highestY) / METER_SCALE));
      if (score >= lastPulseAt + 10) {
        lastPulseAt = score;
        scorePulse = 1;
      }

      // --- Stage transition (banner on entering a new stage) ---
      const stNow = stageForMeters(score);
      if (stNow > stageIdx) {
        stageIdx = stNow;
        stageBanner = { idx: stNow, name: STAGES[stNow].name, t: 0 };
        spawnBurst(W / 2, H * 0.35, 16, '#ffd54f', 3);
      }

      // --- Sky blends between stage skies with altitude ---
      skyT = skyTForScore(score);

      // --- Cull content far below the view ---
      platforms = platforms.filter(p => p.y < cameraY + H + 120);
      enemies = enemies.filter(e => e.y < cameraY + H + 120);
      pickups = pickups.filter(p => p.y < cameraY + H + 120);

      // --- Procedurally generate platforms above the view ---
      let topY = Infinity;
      for (const p of platforms) if (!p.broken && p.y < topY) topY = p.y;
      if (!Number.isFinite(topY)) topY = cameraY; // safety: never an empty field
      let guard = 0;
      while (topY > cameraY - H && guard++ < 500) topY = generatePlatform(topY);

      // --- Game over: fell below the screen ---
      if (character.y - cameraY > H + 60) die('fall');
    } else if (state === 'dying') {
      character.vy += GRAVITY * 1.3;
      character.y += character.vy;
      character.rot = (character.rot || 0) + 0.18 * character.facing;
      if (--deathTimer <= 0) state = 'gameover';
    }
  }

  // ---------- Drawing ----------
  function drawBackground() {
    const c = skyColors(skyT);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, c.top);
    grad.addColorStop(0.6, c.mid);
    grad.addColorStop(1, c.bot);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars fade in from Cavernas onward
    if (skyT > 2.6) {
      const a = clamp((skyT - 2.6) / 1.4, 0, 1);
      ctx.fillStyle = '#ffffff';
      for (const s of stars) {
        let sy = (s.y - cameraY * 0.12) % H;
        if (sy < 0) sy += H;
        const tw = 0.5 + 0.5 * Math.sin(tick * 0.03 + s.phase);
        ctx.globalAlpha = a * (0.35 + 0.65 * tw) * s.a;
        ctx.beginPath();
        ctx.arc(s.x, sy, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    drawSunMoon();
    drawScenery();
  }

  // Per-stage scenery layers (each cross-fades in/out around its stage)
  function drawScenery() {
    drawMeadowGround();
    drawForestTrees();
    drawMountains();
    drawCave();
    drawVolcanoSide();
    drawSpaceObjects();
    drawAlienTerrain();
    drawNebulaBands();
  }

  // Sun (early stages) gives way to a cratered moon (late stages)
  function drawSunMoon() {
    const sunA = clamp(1 - (skyT - 2.7) / 0.7, 0, 1);
    if (sunA > 0) {
      const x = W - 84, y = 96;
      let g = ctx.createRadialGradient(x, y, 8, x, y, 72);
      g.addColorStop(0, 'rgba(255,238,178,0.85)');
      g.addColorStop(1, 'rgba(255,238,178,0)');
      ctx.globalAlpha = sunA;
      ctx.fillStyle = g;
      ctx.fillRect(x - 72, y - 72, 144, 144);
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff7dd';
      ctx.beginPath(); ctx.arc(x - 6, y - 6, 18, 0, Math.PI * 2); ctx.fill();
    }
    const moonA = clamp((skyT - 3.5) / 0.9, 0, 1);
    if (moonA > 0) {
      const x = W - 84, y = 96;
      let g = ctx.createRadialGradient(x, y, 6, x, y, 56);
      g.addColorStop(0, 'rgba(214,228,255,0.7)');
      g.addColorStop(1, 'rgba(214,228,255,0)');
      ctx.globalAlpha = moonA;
      ctx.fillStyle = g;
      ctx.fillRect(x - 56, y - 56, 112, 112);
      ctx.fillStyle = '#e9efff';
      ctx.beginPath(); ctx.arc(x, y, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(158,173,208,0.55)';
      ctx.beginPath(); ctx.arc(x - 6, y - 4, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 6, y + 6, 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 1, y - 9, 1.7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Prado: grassy ground with hills, trees and flowers (scrolls away as you climb)
  function drawMeadowGround() {
    const a = fadeWindow(skyT, -0.5, 1.0, 0.3);
    if (a <= 0) return;
    const sy = H - 64 - cameraY * 0.55;
    if (sy > H + 90) return;
    ctx.globalAlpha = a;
    // Back hill
    ctx.fillStyle = '#a5d87c';
    ctx.beginPath();
    ctx.moveTo(-4, sy - 26);
    ctx.quadraticCurveTo(W * 0.3, sy - 78, W * 0.56, sy - 30);
    ctx.quadraticCurveTo(W * 0.82, sy + 2, W + 4, sy - 16);
    ctx.lineTo(W + 4, H + 90);
    ctx.lineTo(-4, H + 90);
    ctx.closePath();
    ctx.fill();
    // Front hill
    ctx.fillStyle = '#7cc25b';
    ctx.beginPath();
    ctx.moveTo(-4, sy + 10);
    ctx.quadraticCurveTo(W * 0.36, sy - 36, W * 0.72, sy + 8);
    ctx.quadraticCurveTo(W * 0.9, sy + 24, W + 4, sy + 12);
    ctx.lineTo(W + 4, H + 90);
    ctx.lineTo(-4, H + 90);
    ctx.closePath();
    ctx.fill();
    meadowTree(58, sy - 34, 1.0);
    meadowTree(W - 70, sy - 26, 0.85);
    const flowers = [[90, sy + 2], [170, sy - 8], [260, sy + 4], [330, sy + 12]];
    for (const f of flowers) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(f[0], f[1] - 5, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd54f';
      ctx.beginPath(); ctx.arc(f[0], f[1] - 5, 1.1, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function meadowTree(x, y, s) {
    ctx.fillStyle = '#6d4c33';
    ctx.fillRect(x - 3 * s, y, 6 * s, 20 * s);
    ctx.fillStyle = '#4e9a51';
    ctx.beginPath(); ctx.arc(x, y - 8 * s, 15 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5fae63';
    ctx.beginPath(); ctx.arc(x - 7 * s, y - 2 * s, 10 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 8 * s, y - 3 * s, 9 * s, 0, Math.PI * 2); ctx.fill();
  }

  // Floresta: tree silhouettes passing by on both edges (parallax wrap)
  function drawForestTrees() {
    const a = fadeWindow(skyT, 0.6, 2.2, 0.35);
    if (a <= 0) return;
    const f = 0.5, span = H + 90;
    ctx.globalAlpha = a;
    for (const t of trees) {
      let sy = (t.y - cameraY * f) % span;
      if (sy < 0) sy += span;
      forestTree(t.x, sy - 45, t.s, t.variant);
    }
    ctx.globalAlpha = 1;
  }

  function forestTree(x, y, s, variant) {
    if (variant === 0) { // round canopy
      ctx.fillStyle = '#4a3826';
      ctx.fillRect(x - 3 * s, y + 14 * s, 6 * s, 18 * s);
      ctx.fillStyle = '#2c6e49';
      ctx.beginPath(); ctx.arc(x, y, 17 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#35805a';
      ctx.beginPath(); ctx.arc(x - 6 * s, y + 5 * s, 11 * s, 0, Math.PI * 2); ctx.fill();
    } else { // pine
      ctx.fillStyle = '#4a3826';
      ctx.fillRect(x - 2.5 * s, y + 20 * s, 5 * s, 12 * s);
      ctx.fillStyle = '#276b45';
      for (let i = 0; i < 3; i++) {
        const ty = y - i * 10 * s, tw = (16 - i * 4) * s;
        ctx.beginPath();
        ctx.moveTo(x - tw, ty + 12 * s);
        ctx.lineTo(x, ty - 8 * s);
        ctx.lineTo(x + tw, ty + 12 * s);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // Montanhas: two parallax rows of jagged peaks with snow caps
  function drawMountains() {
    const a = fadeWindow(skyT, 1.7, 3.3, 0.4);
    if (a <= 0) return;
    drawRidge(ridgeFar, H + 140, 0.16, '#7d8cc4', 0.4 * a);
    drawRidge(ridgeNear, H + 140, 0.3, '#5f6fae', 0.55 * a);
  }

  function drawRidge(rows, span, f, color, alpha) {
    if (alpha <= 0) return;
    ctx.globalAlpha = alpha;
    for (const row of rows) {
      let sy = (row.y - cameraY * f) % span;
      if (sy < 0) sy += span;
      const base = sy - 70;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-12, base);
      for (const p of row.pts) ctx.lineTo(p.x, base - p.h);
      ctx.lineTo(W + 12, base);
      ctx.lineTo(W + 12, base + 70);
      ctx.lineTo(-12, base + 70);
      ctx.closePath();
      ctx.fill();
      // Snow caps on the tallest peaks
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (const p of row.pts) {
        if (p.h < 78) continue;
        const px = p.x, py = base - p.h;
        ctx.beginPath();
        ctx.moveTo(px - 9, py + 12);
        ctx.lineTo(px, py);
        ctx.lineTo(px + 9, py + 12);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // Cavernas: rock corridor — side walls, stalactites/stalagmites, glowing gems
  function drawCave() {
    const a = fadeWindow(skyT, 2.7, 4.3, 0.4);
    if (a <= 0) return;
    ctx.globalAlpha = a;
    // Corridor walls framing the play area
    ctx.fillStyle = '#191126';
    ctx.beginPath();
    ctx.moveTo(-6, -6);
    for (const p of caveWalls.left) ctx.lineTo(p.d, p.y);
    ctx.lineTo(-6, H + 6);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W + 6, -6);
    for (const p of caveWalls.right) ctx.lineTo(W - p.d, p.y);
    ctx.lineTo(W + 6, H + 6);
    ctx.closePath();
    ctx.fill();
    // Stalactites from the top edge (two depth layers)
    ctx.fillStyle = '#241b38';
    for (const s of caveTopFar) {
      ctx.beginPath();
      ctx.moveTo(s.x - s.w / 2, -3);
      ctx.lineTo(s.x + s.w / 2, -3);
      ctx.lineTo(s.x, s.len);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#2f2450';
    for (const s of caveTopNear) {
      ctx.beginPath();
      ctx.moveTo(s.x - s.w / 2, -3);
      ctx.lineTo(s.x + s.w / 2, -3);
      ctx.lineTo(s.x, s.len * 0.8);
      ctx.closePath();
      ctx.fill();
    }
    // Stalagmites from the bottom edge
    ctx.fillStyle = '#241b38';
    for (const g of caveBotFar) {
      ctx.beginPath();
      ctx.moveTo(g.x - g.w / 2, H + 3);
      ctx.lineTo(g.x + g.w / 2, H + 3);
      ctx.lineTo(g.x, H - g.len);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#2f2450';
    for (const g of caveBotNear) {
      ctx.beginPath();
      ctx.moveTo(g.x - g.w / 2, H + 3);
      ctx.lineTo(g.x + g.w / 2, H + 3);
      ctx.lineTo(g.x, H - g.len * 0.8);
      ctx.closePath();
      ctx.fill();
    }
    // Pulsing gems on the walls
    for (const gem of caveGems) {
      const tw = 0.5 + 0.5 * Math.sin(tick * 0.05 + gem.phase);
      ctx.fillStyle = 'rgba(127,227,255,' + (0.25 + 0.45 * tw).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(gem.x, gem.y, 3 + tw, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Vulcão: volcano cones on the edges with glowing craters and lava streaks
  function drawVolcanoSide() {
    const a = fadeWindow(skyT, 3.7, 5.2, 0.4);
    if (a <= 0) return;
    const f = 0.55, span = H + 160;
    ctx.globalAlpha = a;
    for (const v of volcanoes) {
      let sy = (v.y - cameraY * f) % span;
      if (sy < 0) sy += span;
      volcanoCone(v.x, sy - 80, v.s);
    }
    ctx.globalAlpha = 1;
  }

  function volcanoCone(x, y, s) { // y = crater center
    const w = 54 * s, h = 62 * s;
    ctx.fillStyle = '#3a120c';
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y + h);
    ctx.lineTo(x - w * 0.18, y);
    ctx.lineTo(x + w * 0.18, y);
    ctx.lineTo(x + w / 2, y + h);
    ctx.closePath();
    ctx.fill();
    // Crater glow (pulsing)
    const pulse = 0.6 + 0.4 * Math.sin(tick * 0.05 + x);
    let g = ctx.createRadialGradient(x, y, 1, x, y, 16 * s);
    g.addColorStop(0, 'rgba(255,170,80,' + (0.9 * pulse).toFixed(2) + ')');
    g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 16 * s, y - 16 * s, 32 * s, 32 * s);
    // Lava streaks down the cone
    ctx.strokeStyle = 'rgba(255,140,50,' + (0.5 + 0.3 * pulse).toFixed(2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.1, y + 4);
    ctx.lineTo(x - w * 0.26, y + h * 0.55);
    ctx.moveTo(x + w * 0.12, y + 6);
    ctx.lineTo(x + w * 0.3, y + h * 0.7);
    ctx.stroke();
  }

  // Espaço: ringed planet, cratered moon and a soft nebula drifting by
  function drawSpaceObjects() {
    const a = clamp((skyT - 4.55) / 0.9, 0, 1);
    if (a <= 0) return;
    const f = 0.12, span = H + 200;
    ctx.globalAlpha = a;
    for (const p of planets) {
      let sy = (p.y - cameraY * f) % span;
      if (sy < 0) sy += span;
      const y = sy - 100;
      if (p.type === 'ringed') spacePlanet(p.x, y, 24 * p.s);
      else if (p.type === 'moon') spaceMoon(p.x, y, 11 * p.s);
      else spaceNebula(p.x, y, 60 * p.s);
    }
    ctx.globalAlpha = 1;
  }

  function spacePlanet(x, y, r) {
    let g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.2, x, y, r);
    g.addColorStop(0, '#8fd3e8');
    g.addColorStop(1, '#3f7fae');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    // Cloud band
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - r * 0.9, y + r * 0.25);
    ctx.quadraticCurveTo(x, y + r * 0.45, x + r * 0.9, y + r * 0.2);
    ctx.stroke();
    // Ring
    ctx.strokeStyle = 'rgba(216,228,255,0.75)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.7, r * 0.45, -0.35, 0, Math.PI * 2);
    ctx.stroke();
  }

  function spaceMoon(x, y, r) {
    ctx.fillStyle = '#b9c2d8';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(120,132,158,0.6)';
    ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + r * 0.35, y + r * 0.3, r * 0.2, 0, Math.PI * 2); ctx.fill();
  }

  function spaceNebula(x, y, r) {
    let g = ctx.createRadialGradient(x, y, 4, x, y, r);
    g.addColorStop(0, 'rgba(150,96,224,0.30)');
    g.addColorStop(0.6, 'rgba(88,70,190,0.16)');
    g.addColorStop(1, 'rgba(88,70,190,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    let g2 = ctx.createRadialGradient(x + r * 0.5, y + r * 0.3, 2, x + r * 0.5, y + r * 0.3, r * 0.7);
    g2.addColorStop(0, 'rgba(96,180,224,0.22)');
    g2.addColorStop(1, 'rgba(96,180,224,0)');
    ctx.fillStyle = g2;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // Planeta: crystal spires passing by on both edges + a faint horizon glow
  function drawAlienTerrain() {
    const a = fadeWindow(skyT, 5.6, 7.1, 0.4);
    if (a <= 0) return;
    const f = 0.5, span = H + 90;
    ctx.globalAlpha = a;
    for (const s of spires) {
      let sy = (s.y - cameraY * f) % span;
      if (sy < 0) sy += span;
      alienSpike(s.x, sy - 45, s.s, s.hue);
    }
    // Horizon glow at the bottom of the screen
    let g = ctx.createLinearGradient(0, H - 90, 0, H);
    g.addColorStop(0, 'rgba(111,211,199,0)');
    g.addColorStop(1, 'rgba(111,211,199,' + (0.28 * a).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, H - 90, W, 90);
    ctx.globalAlpha = 1;
  }

  function alienSpike(x, y, s, hue) {
    const cols = [['#2e7d8a', '111,211,199'], ['#3b6ea5', '127,184,240'], ['#4a5fae', '154,168,240']];
    ctx.fillStyle = cols[hue][0];
    ctx.beginPath();
    ctx.moveTo(x - 12 * s, y + 26 * s);
    ctx.lineTo(x - 3 * s, y - 14 * s);
    ctx.lineTo(x + 3 * s, y - 14 * s);
    ctx.lineTo(x + 12 * s, y + 26 * s);
    ctx.closePath();
    ctx.fill();
    // Glowing tip (twinkles)
    const tw = 0.5 + 0.5 * Math.sin(tick * 0.08 + x);
    ctx.fillStyle = 'rgba(' + cols[hue][1] + ',' + (0.35 + 0.6 * tw).toFixed(2) + ')';
    ctx.beginPath();
    ctx.moveTo(x - 3 * s, y - 14 * s);
    ctx.lineTo(x, y - 26 * s);
    ctx.lineTo(x + 3 * s, y - 14 * s);
    ctx.closePath();
    ctx.fill();
  }

  // Nebulosa: drifting gas blobs, aurora ribbons and a rotating spiral galaxy
  function drawNebulaBands() {
    const a = fadeWindow(skyT, 6.5, 8.2, 0.4);
    if (a <= 0) return;
    ctx.globalAlpha = a;
    // Drifting gas blobs (slow parallax wrap)
    const f = 0.1, span = H + 160;
    for (const c of gasClouds) {
      let sy = (c.y - cameraY * f) % span;
      if (sy < 0) sy += span;
      nebulaGas(c.x, sy - 80, 70 * c.s, c.hue);
    }
    // Aurora ribbons
    const bands = [
      { y: H * 0.24, amp: 26, col: 'rgba(127,227,255,', sp: 0.02 },
      { y: H * 0.42, amp: 34, col: 'rgba(201,154,240,', sp: -0.016 },
      { y: H * 0.62, amp: 22, col: 'rgba(255,127,196,', sp: 0.013 }
    ];
    for (const b of bands) {
      ctx.strokeStyle = b.col + '0.14)';
      ctx.lineWidth = 26;
      ctx.beginPath();
      for (let x = -10; x <= W + 10; x += 16) {
        const y = b.y + Math.sin(x * 0.018 + tick * b.sp) * b.amp;
        if (x === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // Spiral galaxy
    spiralGalaxy(W * 0.74, H * 0.2, 34);
    ctx.globalAlpha = 1;
  }

  function nebulaGas(x, y, r, hue) {
    const cols = [
      ['rgba(150,96,224,', 'rgba(88,70,190,'],
      ['rgba(255,127,196,', 'rgba(190,80,160,'],
      ['rgba(96,180,224,', 'rgba(70,130,190,']
    ][hue];
    let g = ctx.createRadialGradient(x, y, 4, x, y, r);
    g.addColorStop(0, cols[0] + '0.30)');
    g.addColorStop(0.6, cols[1] + '0.15)');
    g.addColorStop(1, cols[1] + '0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function spiralGalaxy(x, y, r) {
    const rot = tick * 0.004;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    let g = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
    g.addColorStop(0, 'rgba(255,240,220,0.8)');
    g.addColorStop(0.35, 'rgba(201,154,240,0.35)');
    g.addColorStop(1, 'rgba(201,154,240,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // Two spiral arms
    ctx.strokeStyle = 'rgba(230,200,255,0.4)';
    ctx.lineWidth = 3;
    for (let arm = 0; arm < 2; arm++) {
      ctx.beginPath();
      for (let i = 0; i <= 26; i++) {
        const ang = arm * Math.PI + i * 0.24;
        const rr = 4 + i * (r - 6) / 26;
        const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr * 0.75;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // Puffy multi-lobe cloud shape (shared by near + far layers)
  function drawCloudShape(x, y, r) {
    ctx.beginPath();
    ctx.arc(x - r * 0.9, y + r * 0.15, r * 0.6, 0, Math.PI * 2);
    ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.8, 0, Math.PI * 2);
    ctx.arc(x + r * 0.45, y - r * 0.15, r * 0.68, 0, Math.PI * 2);
    ctx.arc(x + r * 0.95, y + r * 0.2, r * 0.55, 0, Math.PI * 2);
    ctx.ellipse(x, y + r * 0.35, r * 1.35, r * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFarClouds() {
    const fill = cloudFill(skyT, 0.6);
    if (!fill) return;
    ctx.fillStyle = fill;
    for (const c of farClouds) {
      let sy = (c.y - cameraY * 0.15) % H;
      if (sy < 0) sy += H;
      const cx = ((c.x + tick * c.drift) % (W + 90)) - 45;
      drawCloudShape(cx, sy, c.r);
    }
  }

  function drawClouds() {
    const fill = cloudFill(skyT, 1);
    if (!fill) return;
    ctx.fillStyle = fill;
    for (const c of clouds) {
      let sy = (c.y - cameraY * 0.4) % H;
      if (sy < 0) sy += H;
      const cx = ((c.x + tick * c.drift) % (W + 90)) - 45;
      drawCloudShape(cx, sy, c.r);
    }
  }

  // Subtle vignette for depth (drawn over the world, under the UI)
  function drawVignette() {
    const g = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H * 0.5, H * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(8,10,24,0.16)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBrittlePlatform(p, sy) {
    const chunks=p.broken?3:1, gap=p.broken?2:0, cw=(p.w-gap*(chunks-1))/chunks;
    for(let i=0;i<chunks;i++){
      ctx.save();
      if(p.broken){const dir=i-1;ctx.translate(dir*p.breakAge*.18,Math.abs(dir)*p.breakAge*.22);ctx.rotate(dir*p.breakAge*.018);}
      const x=p.x+i*(cw+gap),g=ctx.createLinearGradient(x,sy,x,sy+p.h);g.addColorStop(0,'#e1b56f');g.addColorStop(1,'#9b6335');
      ctx.fillStyle=g;roundRect(x,sy,cw,p.h,5);ctx.fill();ctx.fillStyle='rgba(255,232,183,.55)';roundRect(x,sy,cw,p.h*.38,5);ctx.fill();ctx.restore();
    }
    if(!p.broken){
      ctx.strokeStyle='#684329';ctx.lineWidth=1.6;ctx.lineCap='round';
      const cracks=[[.22,0,.32,.42,.27,.76],[.52,0,.46,.38,.57,.72],[.78,0,.69,.45,.75,.82]];
      for(const c of cracks){ctx.beginPath();ctx.moveTo(p.x+p.w*c[0],sy);ctx.lineTo(p.x+p.w*c[1],sy+p.h*c[2]);ctx.lineTo(p.x+p.w*c[3],sy+p.h*c[4]);ctx.stroke();}
    }
  }

  function drawPlatform(p, sy) {
    if (p.brittle) { drawBrittlePlatform(p, sy); return; }
    const t = STAGES[p.theme || 0].plat;
    // Body
    ctx.fillStyle = t.body;
    roundRect(p.x, sy, p.w, p.h, 8);
    ctx.fill();
    // Top highlight
    ctx.fillStyle = t.top;
    roundRect(p.x, sy, p.w, p.h * 0.55, 8);
    ctx.fill();

    // Biome decoration on the top edge
    if (t.deco === 'grass') {
      ctx.fillStyle = '#66bb6a';
      for (let i = 0; i < 3; i++) {
        const gx = p.x + p.w * (0.25 + i * 0.25);
        ctx.beginPath();
        ctx.moveTo(gx - 3, sy);
        ctx.lineTo(gx, sy - 5);
        ctx.lineTo(gx + 3, sy);
        ctx.closePath();
        ctx.fill();
      }
    } else if (t.deco === 'leaf') {
      ctx.fillStyle = '#1f6e4e';
      for (let i = 0; i < 3; i++) {
        const gx = p.x + p.w * (0.25 + i * 0.25);
        ctx.beginPath();
        ctx.ellipse(gx, sy - 3, 4, 2.6, (i - 1) * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (t.deco === 'snow') {
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 3; i++) {
        const gx = p.x + p.w * (0.25 + i * 0.25);
        ctx.beginPath();
        ctx.moveTo(gx - 4, sy);
        ctx.lineTo(gx, sy - 6);
        ctx.lineTo(gx + 4, sy);
        ctx.closePath();
        ctx.fill();
      }
    } else if (t.deco === 'crystal') {
      for (let i = 0; i < 2; i++) {
        const gx = p.x + p.w * (0.35 + i * 0.3);
        ctx.fillStyle = 'rgba(127,227,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(gx, sy - 8);
        ctx.lineTo(gx + 4, sy - 3);
        ctx.lineTo(gx, sy);
        ctx.lineTo(gx - 4, sy - 3);
        ctx.closePath();
        ctx.fill();
      }
    } else if (t.deco === 'lava') {
      for (let i = 0; i < 3; i++) {
        const gx = p.x + p.w * (0.25 + i * 0.25);
        ctx.fillStyle = 'rgba(255,140,60,0.85)';
        ctx.beginPath();
        ctx.arc(gx, sy - 3, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffd54f';
        ctx.beginPath();
        ctx.arc(gx, sy - 3, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (t.deco === 'alien') {
      for (let i = 0; i < 3; i++) {
        const gx = p.x + p.w * (0.25 + i * 0.25);
        ctx.fillStyle = '#6fd3c7';
        ctx.beginPath();
        ctx.moveTo(gx - 3, sy);
        ctx.lineTo(gx, sy - 7);
        ctx.lineTo(gx + 3, sy);
        ctx.closePath();
        ctx.fill();
      }
    } else if (t.deco === 'nebula') {
      for (let i = 0; i < 3; i++) {
        const gx = p.x + p.w * (0.25 + i * 0.25);
        const a = 0.5 + 0.5 * Math.sin(tick * 0.1 + i * 2 + p.x);
        ctx.fillStyle = 'rgba(255,127,196,' + (0.35 + 0.6 * a).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(gx, sy - 4, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    } else { // spark (space) — twinkling dots
      for (let i = 0; i < 3; i++) {
        const gx = p.x + p.w * (0.25 + i * 0.25);
        const a = 0.5 + 0.5 * Math.sin(tick * 0.1 + i * 2 + p.x);
        ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.6 * a).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(gx, sy - 4, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawSpring(p, sy) {
    const cx = p.x + p.w / 2;
    const hgt = 14 * (p.springT > 0 ? 0.55 : 1); // compresses on bounce
    // Coil
    ctx.strokeStyle = '#ffd54f';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, sy - 2);
    const segs = 4;
    for (let i = 1; i <= segs; i++) {
      ctx.lineTo(cx + (i % 2 === 0 ? -7 : 7), sy - 2 - hgt * (i / segs));
    }
    ctx.stroke();
    // Top plate
    ctx.fillStyle = '#f9a825';
    roundRect(cx - 11, sy - 2 - hgt - 4, 22, 5, 2.5);
    ctx.fill();
  }

  function drawEnemy(e) {
    if (e.kind === 'slime') return drawSlime(e);
    if (e.kind === 'spider') return drawSpider(e);
    if (e.kind === 'bat')   return drawBat(e);
    if (e.kind === 'ghost') return drawGhost(e);
    if (e.kind === 'ufo')   return drawUfo(e);
    if (e.kind === 'robot') return drawRobot(e);
    if (e.kind === 'alien') return drawAlien(e);
    if (e.kind === 'comet') return drawComet(e);
    drawPtero(e);
  }

  function drawSpider(e) {
    const sy=e.y-cameraY;if(sy < -50 || sy > H+50)return;ctx.save();ctx.translate(e.x+e.w/2,sy+e.h/2);
    ctx.strokeStyle='rgba(240,245,255,.75)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,-35);ctx.lineTo(0,-10);ctx.stroke();
    const leg=Math.sin(tick*.12+e.phase)*3;ctx.strokeStyle='#2b2035';ctx.lineWidth=3;ctx.lineCap='round';
    for(const side of [-1,1])for(let i=0;i<4;i++){const yy=-7+i*5;ctx.beginPath();ctx.moveTo(side*4,yy);ctx.quadraticCurveTo(side*(11+leg),yy-5,side*15,yy+(i-1.5)*3);ctx.stroke();}
    ctx.fillStyle='#3a2947';ctx.beginPath();ctx.ellipse(0,4,9,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#594064';ctx.beginPath();ctx.arc(0,-7,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff5a68';for(const ex of [-3,3]){ctx.beginPath();ctx.arc(ex,-8,1.8,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#b86bd1';ctx.beginPath();ctx.moveTo(0,-1);ctx.lineTo(3,4);ctx.lineTo(0,8);ctx.lineTo(-3,4);ctx.closePath();ctx.fill();ctx.restore();
  }

  function drawPtero(e) {
    const sy = e.y - cameraY;
    if (sy < -40 || sy > H + 40) return;
    const flap = Math.sin(tick * 0.3 + e.phase);
    ctx.save();
    ctx.translate(e.x + e.w / 2, sy + e.h / 2);
    ctx.scale(Math.sign(e.vx) || 1, 1); // face travel direction

    // Far wing (flapping)
    ctx.fillStyle = '#5d4a9e';
    ctx.beginPath();
    ctx.moveTo(-2, -2);
    ctx.lineTo(-16, -10 - flap * 8);
    ctx.lineTo(2, -6);
    ctx.closePath();
    ctx.fill();

    // Tail
    ctx.fillStyle = '#7c5cbf';
    ctx.beginPath();
    ctx.moveTo(-12, -2);
    ctx.lineTo(-20, -6 + flap * 3);
    ctx.lineTo(-14, 3);
    ctx.closePath();
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Head + beak
    ctx.beginPath();
    ctx.arc(13, -4, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f5a623';
    ctx.beginPath();
    ctx.moveTo(18, -6);
    ctx.lineTo(27, -3);
    ctx.lineTo(18, -1);
    ctx.closePath();
    ctx.fill();

    // Eye
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(14, -5, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#20303a';
    ctx.beginPath();
    ctx.arc(14.8, -5, 1.1, 0, Math.PI * 2);
    ctx.fill();

    // Near wing (flapping)
    ctx.fillStyle = '#6b54b5';
    ctx.beginPath();
    ctx.moveTo(-2, 0);
    ctx.lineTo(8, -12 - flap * 9);
    ctx.lineTo(10, -2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawSlime(e) {
    const sy = e.y - cameraY;
    if (sy < -40 || sy > H + 40) return;
    ctx.save();
    ctx.translate(e.x + e.w / 2, sy + e.h); // anchor at the bottom
    const stretch = clamp(-e.vy * 0.05, -0.3, 0.35); // tall while rising, flat on landing
    ctx.scale(1 - stretch * 0.7, 1 + stretch);

    // Body (blob with a flat bottom)
    ctx.fillStyle = '#6fd06a';
    ctx.beginPath();
    ctx.moveTo(-15, 0);
    ctx.quadraticCurveTo(-18, -24, 0, -27);
    ctx.quadraticCurveTo(18, -24, 15, 0);
    ctx.closePath();
    ctx.fill();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(-6, -18, 4, 6, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-5, -13, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -13, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#20303a';
    ctx.beginPath(); ctx.arc(-4.3, -12.6, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5.7, -12.6, 1.5, 0, Math.PI * 2); ctx.fill();

    // Mouth
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath();
    ctx.ellipse(0.5, -8, 2.4, 1.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawBat(e) {
    const sy = e.y - cameraY;
    if (sy < -40 || sy > H + 40) return;
    ctx.save();
    ctx.translate(e.x + e.w / 2, sy + e.h / 2);
    ctx.scale(Math.sign(e.vx) || 1, 1); // face travel direction
    const flap = Math.sin(tick * 0.5 + e.phase);

    // Far wing (fast flapping)
    ctx.fillStyle = '#5d3f96';
    ctx.beginPath();
    ctx.moveTo(-2, -2);
    ctx.lineTo(-15, -9 - flap * 8);
    ctx.lineTo(-4, 3);
    ctx.closePath();
    ctx.fill();

    // Body + head
    ctx.fillStyle = '#8a63c9';
    ctx.beginPath();
    ctx.ellipse(0, 0, 8, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(7, -4, 5.5, 0, Math.PI * 2);
    ctx.fill();

    // Ears
    ctx.beginPath();
    ctx.moveTo(3, -8); ctx.lineTo(4.5, -14); ctx.lineTo(7, -9);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8, -8.5); ctx.lineTo(10, -14); ctx.lineTo(11.5, -8);
    ctx.closePath();
    ctx.fill();

    // Eye + fang
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(8.5, -5, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d94f4f';
    ctx.beginPath(); ctx.arc(9, -5, 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(9.5, -1); ctx.lineTo(10.8, 2); ctx.lineTo(11.5, -0.5);
    ctx.closePath();
    ctx.fill();

    // Near wing (fast flapping)
    ctx.fillStyle = '#7a55bb';
    ctx.beginPath();
    ctx.moveTo(-1, 1);
    ctx.lineTo(9, -8 - flap * 9);
    ctx.lineTo(11, 2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawGhost(e) {
    const sy = e.y - cameraY;
    if (sy < -40 || sy > H + 40) return;
    ctx.save();
    ctx.translate(e.x + e.w / 2, sy + e.h / 2);
    ctx.globalAlpha = 0.7;

    // Body: dome top + wavy bottom
    ctx.fillStyle = '#e8f0ff';
    ctx.beginPath();
    ctx.moveTo(-12, 15);
    ctx.lineTo(-12, -6);
    ctx.arc(0, -6, 12, Math.PI, 0);
    ctx.lineTo(12, 15);
    ctx.quadraticCurveTo(8, 9, 4, 15);
    ctx.quadraticCurveTo(0, 9, -4, 15);
    ctx.quadraticCurveTo(-8, 9, -12, 15);
    ctx.closePath();
    ctx.fill();

    // Eyes + worried mouth
    ctx.fillStyle = '#3a4a6b';
    ctx.beginPath(); ctx.arc(-4.5, -5, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4.5, -5, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 2, 1.8, 2.4, 0, 0, Math.PI * 2); ctx.fill();

    ctx.restore(); // also restores globalAlpha
  }

  function drawUfo(e) {
    const sy = e.y - cameraY;
    if (sy < -40 || sy > H + 40) return;
    ctx.save();
    ctx.translate(e.x + e.w / 2, sy + e.h / 2);

    // Glass dome
    ctx.fillStyle = 'rgba(140,220,255,0.85)';
    ctx.beginPath();
    ctx.arc(0, -2, 9, Math.PI, 0);
    ctx.closePath();
    ctx.fill();

    // Disc
    ctx.fillStyle = '#b9c6dd';
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Darker bottom rim
    ctx.fillStyle = '#8fa0bd';
    ctx.beginPath();
    ctx.ellipse(0, 2.5, 14, 4.5, 0, 0, Math.PI);
    ctx.fill();

    // Blinking lights
    const cols = ['#ff6b6b', '#ffd54f', '#7ed957'];
    for (let i = -1; i <= 1; i++) {
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(tick * 0.25 + i * 1.3));
      ctx.fillStyle = cols[i + 1];
      ctx.beginPath();
      ctx.arc(i * 9, -1, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawRobot(e) {
    const sy = e.y - cameraY;
    if (sy < -40 || sy > H + 40) return;
    ctx.save();
    ctx.translate(e.x + e.w / 2, sy + e.h / 2);

    // Antenna with blinking light
    const blink = Math.sin(tick * 0.3 + e.phase) > 0 ? '#ff6b6b' : 'rgba(255,107,107,0.35)';
    ctx.strokeStyle = '#8fa0bd';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(0, -20); ctx.stroke();
    ctx.fillStyle = blink;
    ctx.beginPath(); ctx.arc(0, -21.5, 2.6, 0, Math.PI * 2); ctx.fill();

    // Body (boxy) + darker panel
    ctx.fillStyle = '#9fb2cc';
    roundRect(-14, -13, 28, 24, 5);
    ctx.fill();
    ctx.fillStyle = '#6b7f9e';
    roundRect(-10, -2, 20, 10, 3);
    ctx.fill();

    // Scanning eye
    const scan = Math.sin(tick * 0.12 + e.phase) * 5;
    ctx.fillStyle = '#1d2b3a';
    roundRect(-9, -10, 18, 7, 3);
    ctx.fill();
    ctx.fillStyle = '#4fe3c1';
    ctx.beginPath(); ctx.arc(scan, -6.5, 2.6, 0, Math.PI * 2); ctx.fill();

    // Hover thrusters (flickering)
    const fl = 0.5 + 0.5 * Math.sin(tick * 0.4 + e.phase);
    ctx.fillStyle = 'rgba(127,227,255,' + (0.35 + 0.4 * fl).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(-8, 14, 3 + fl * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 14, 3 + fl * 1.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function drawAlien(e) {
    const sy = e.y - cameraY;
    if (sy < -40 || sy > H + 40) return;
    ctx.save();
    ctx.translate(e.x + e.w / 2, sy + e.h); // anchor at the bottom
    const stretch = clamp(-e.vy * 0.05, -0.3, 0.35); // tall while rising, flat on landing
    ctx.scale(1 - stretch * 0.7, 1 + stretch);

    // Antennae with glowing tips
    const sway = Math.sin(tick * 0.15 + e.phase) * 3;
    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6, -22); ctx.quadraticCurveTo(-9 + sway, -30, -8 + sway, -34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -22); ctx.quadraticCurveTo(9 + sway, -30, 8 + sway, -34); ctx.stroke();
    const tipA = 0.5 + 0.5 * Math.sin(tick * 0.2 + e.phase);
    ctx.fillStyle = 'rgba(174,240,120,' + (0.5 + 0.5 * tipA).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(-8 + sway, -35, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8 + sway, -35, 2.4, 0, Math.PI * 2); ctx.fill();

    // Body (teardrop)
    ctx.fillStyle = '#7ed957';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.quadraticCurveTo(-16, -22, 0, -26);
    ctx.quadraticCurveTo(16, -22, 14, 0);
    ctx.closePath();
    ctx.fill();

    // Belly highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.ellipse(-5, -12, 4.5, 7, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Big eyes looking toward the player
    const look = clamp((character.x + character.w / 2) - (e.x + e.w / 2), -1.6, 1.6);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-5.5, -14, 3.8, 4.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5.5, -14, 3.8, 4.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#20303a';
    ctx.beginPath(); ctx.arc(-5.5 + look, -13.6, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5.5 + look, -13.6, 1.9, 0, Math.PI * 2); ctx.fill();

    // Mouth
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath();
    ctx.ellipse(0, -7, 2.6, 1.6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawComet(e) {
    const sy = e.y - cameraY;
    if (sy < -40 || sy > H + 40) return;
    ctx.save();
    ctx.translate(e.x + e.w / 2, sy + e.h / 2);

    // Glowing tail trailing behind the motion direction
    const dy = Math.cos(e.phase) * 30 * 0.085; // vertical component of the swing
    let tx = -Math.sign(e.vx), ty = -dy;
    const tl = Math.hypot(tx, ty) || 1;
    tx /= tl; ty /= tl;
    for (let i = 6; i >= 1; i--) {
      ctx.fillStyle = 'rgba(255,' + (180 - i * 14) + ',90,' + (0.34 - i * 0.045).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(tx * i * 7, ty * i * 7, 6.5 - i * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    // Bright head with a halo
    let g = ctx.createRadialGradient(0, 0, 1, 0, 0, 14);
    g.addColorStop(0, 'rgba(255,244,214,0.9)');
    g.addColorStop(1, 'rgba(255,180,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff3d6';
    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }

  function drawPickup(p) {
    const off = Math.sin(tick * 0.06 + p.phase) * 4;
    const sy = p.y - cameraY + off;
    if (sy < -50 || sy > H + 50) return;
    ctx.save();
    ctx.translate(p.x + p.w / 2, sy + p.h / 2);

    if (p.type === 'extraJump') {
      const pulse = 0.72 + Math.sin(tick * 0.14 + p.phase) * 0.18;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = 'rgba(108,232,255,0.24)';
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      // Two upward chevrons make the effect legible without relying on color.
      ctx.strokeStyle = '#d8fbff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-7, 5); ctx.lineTo(0, -2); ctx.lineTo(7, 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-7, -2); ctx.lineTo(0, -9); ctx.lineTo(7, -2); ctx.stroke();
      ctx.fillStyle = '#54cbe8';
      ctx.beginPath(); ctx.arc(0, 10, 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      return;
    }

    if (p.type === 'shield') {
      const pulse = 0.72 + Math.sin(tick * 0.14 + p.phase) * 0.18;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = 'rgba(166,145,255,0.24)';
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#e2504c';
    ctx.beginPath();
    ctx.moveTo(-7, p.h / 2 - 8);
    ctx.lineTo(-12, p.h / 2 + 2);
    ctx.lineTo(-6, p.h / 2 - 2);

    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(7, p.h / 2 - 8);
    ctx.lineTo(12, p.h / 2 + 2);
    ctx.lineTo(6, p.h / 2 - 2);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
